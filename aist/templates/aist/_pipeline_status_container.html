{% load aist_extras %}
{% pipeline_status_panel pipeline as panel %}
{# The pipeline page's status panel; it re-requests itself each time the page signals a status change. #}
<div id="pipeline-status-container"
     data-status="{{ pipeline.status }}"
     data-hydrator="{{ panel.hydrator|default:'' }}"
     data-live-refresh
     hx-get="{{ request.get_full_path }}"
     hx-trigger="aist:status-changed"
     hx-swap="outerHTML"
     hx-sync="this:replace">
    {% if panel.template %}
        {% include panel.template %}
    {% endif %}
</div>
