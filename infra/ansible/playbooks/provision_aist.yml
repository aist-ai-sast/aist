---
- name: Prepare or start an AIST host
  hosts: aist_prod
  become: true
  vars_files:
    - ../group_vars/prod.yml

  pre_tasks:
    - name: Validate explicit checkout and phase
      ansible.builtin.assert:
        that:
          - project_dir is defined
          - project_dir is match('^/')
          - deployment_phase in ['prepare', 'start']

    - name: Check selected environment file
      ansible.builtin.stat:
        path: "{{ compose_env_file if compose_env_file is match('^/') else project_dir ~ '/' ~ compose_env_file }}"
      register: env_file
      no_log: true

    - name: Require a private environment file on the host
      ansible.builtin.assert:
        that:
          - env_file.stat.isreg | default(false)
          - env_file.stat.mode in ['0600', '0400']
        fail_msg: "Provision the selected .env on the target with mode 0600 before running Ansible."

    - name: Install container runtime
      ansible.builtin.include_role:
        name: base

    - name: Resolve deployment configuration with Compose
      ansible.builtin.command:
        argv:
          - python3
          - "{{ project_dir }}/scripts/deployment_config.py"
          - --project-dir
          - "{{ project_dir }}"
          - --env-file
          - "{{ compose_env_file }}"
          - --compose-file
          - "{{ compose_file }}"
      register: deployment_config
      changed_when: false
      no_log: true

    - name: Use resolved operational settings
      ansible.builtin.set_fact:
        deployment: "{{ deployment_config.stdout | from_json }}"
      no_log: true

    - name: Bind role inputs to deployment configuration
      ansible.builtin.set_fact:
        backup_dir: "{{ deployment.backup_dir }}"
        backup_retention_days: "{{ deployment.backup_retention_days }}"
        backup_on_calendar: "{{ deployment.backup_on_calendar }}"
        firewall_manage: "{{ deployment.firewall_manage | bool }}"

  tasks:
    - name: Configure host firewall when explicitly enabled
      ansible.builtin.include_role:
        name: firewall

    - name: Set configured timezone
      ansible.builtin.command:
        argv: [timedatectl, set-timezone, "{{ deployment.timezone }}"]
      changed_when: false

    - name: Prepare persistent directories without initializing a database
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: "0750"
      loop:
        - "{{ deployment.tls_dir }}"
        - "{{ deployment.acme_webroot }}"
        - "{{ deployment.backup_dir }}"

    - name: Prepare PostgreSQL parent without changing restored cluster ownership
      ansible.builtin.file:
        path: "{{ deployment.data_dir }}"
        state: directory
        mode: "0755"

    - name: Prepare persistent TLS certificate
      ansible.builtin.include_role:
        name: aist_tls

    - name: Start application after data restoration
      ansible.builtin.command:
        argv: [bash, "{{ project_dir }}/scripts/deploy-prod.sh"]
        chdir: "{{ project_dir }}"
      environment:
        PROJECT_DIR: "{{ project_dir }}"
        COMPOSE_ENV_FILE: "{{ compose_env_file }}"
        COMPOSE_FILE: "{{ compose_file }}"
      when: deployment_phase == 'start'
      changed_when: true

    - name: Install backup automation only after the database is running
      ansible.builtin.include_role:
        name: aist_backup
      when: deployment_phase == 'start'
