---
- name: Install base packages
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
    name:
      - ca-certificates
      - curl
      - gnupg
      - openssl
      - docker.io
      - docker-compose-plugin
    state: present

- name: Ensure docker service is enabled and running
  ansible.builtin.systemd:
    name: docker
    enabled: true
    state: started

- name: Read current timezone
  ansible.builtin.command:
    argv:
      - timedatectl
      - show
      - --property=Timezone
      - --value
  register: timezone_current
  changed_when: false

- name: Set timezone
  ansible.builtin.command:
    argv:
      - timedatectl
      - set-timezone
      - "{{ timezone }}"
  when: timezone_current.stdout != timezone
  changed_when: true
