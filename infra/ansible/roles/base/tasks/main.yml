---
- name: Install base packages
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
    name:
      - ca-certificates
      - curl
      - gnupg
      - openssl
      - docker.io
      - docker-compose-v2
      - docker-buildx
      - python3
      - python3-cryptography
      - rclone
    state: present

- name: Ensure docker service is enabled and running
  ansible.builtin.systemd:
    name: docker
    enabled: true
    state: started
