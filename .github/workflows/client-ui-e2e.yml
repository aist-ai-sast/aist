name: Client UI e2e tests

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Client UI base URL (for example https://127.0.0.1:8443)"
        required: true
        type: string

jobs:
  playwright-e2e:
    name: Playwright e2e
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client-ui
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: client-ui/package.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Playwright browser
        run: npx playwright install chromium

      - name: Run e2e tests
        env:
          PLAYWRIGHT_BASE_URL: ${{ inputs.base_url }}
        run: npm run test:e2e
