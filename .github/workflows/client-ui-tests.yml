name: Client UI tests

on:
  pull_request:
  workflow_dispatch:

jobs:
  client-ui-unit-tests:
    name: Client UI Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client-ui
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: client-ui/package.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run unit tests
        run: npm run test
