name: Unit tests

on:
  workflow_dispatch:
  pull_request:
    branches:
      - master
      - dev
      - bugfix
      - release/**
      - hotfix/**
  push:
    branches:
      - master

jobs:
  build-docker-containers:
    strategy:
        matrix:
          platform: ['linux/amd64', 'linux/arm64']
        fail-fast: false
    uses: ./.github/workflows/build-docker-images-for-testing.yml
    secrets: inherit
    with:
      platform: ${{ matrix.platform }}

  test-rest-framework:
    strategy:
        matrix:
            platform: ['linux/amd64', 'linux/arm64']
        fail-fast: false
    needs: build-docker-containers
    uses: ./.github/workflows/rest-framework-tests.yml
    secrets: inherit
    with:
      platform: ${{ matrix.platform}}

  test-dast-connector:
    name: DAST connector (${{ matrix.platform }})
    runs-on: ${{ matrix.platform == 'linux/arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        platform: ['linux/amd64', 'linux/arm64']
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Build DAST connector test image
        working-directory: sast-combinator/sast-pipeline
        run: >-
          docker build
          --target test
          --platform ${{ matrix.platform }}
          -f Dockerfiles/dast_connector/Dockerfile
          -t aist-dast-connector-tests:${{ github.sha }}
          .

      # The test image now carries the whole package and test tree, so `pytest
      # tests/pipeline_tests/` really does mean everything. Three files are still excluded
      # because they were outside CI long enough to rot against changed signatures:
      # test_default_imported_project_no_built_script.py (13 failures),
      # test_project_builder.py (4) and test_dockerfile_versions.py (1). Repairing them is
      # tracked in docs/plans/2026-08-13-dast-runtime-launch-chain.md; until then they are named
      # here rather than silently absent from the image, so the debt stays visible.
      - name: Run pipeline unit tests
        run: >-
          docker run --rm
          aist-dast-connector-tests:${{ github.sha }}
          tests/pipeline_tests/
          --ignore=tests/pipeline_tests/test_default_imported_project_no_built_script.py
          --ignore=tests/pipeline_tests/test_project_builder.py
          --ignore=tests/pipeline_tests/test_dockerfile_versions.py
          -p no:cacheprovider
          -q

  # only run integration tests for linux/amd64 (default)
  test-user-interface:
    needs: build-docker-containers
    uses: ./.github/workflows/integration-tests.yml
    secrets: inherit
