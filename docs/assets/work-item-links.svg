 <circle cx="470" cy="109" r="10" class="chip"/><use href="#ico-jira" x="463" y="102" width="14" height="14" aria-hidden="true"/>
 <circle cx="488" cy="109" r="10" class="chip"/><use href="#ico-youtrack" x="481" y="102" width="14" height="14" aria-hidden="true"/>
 <circle cx="506" cy="109" r="10" class="chip"/><use href="#ico-github" x="499" y="102" width="14" height="14" aria-hidden="true"/>
 <circle cx="470" cy="127" r="10" class="chip"/><use href="#ico-gitlab" x="463" y="120" width="14" height="14" aria-hidden="true"/>
