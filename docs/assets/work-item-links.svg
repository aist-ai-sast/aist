<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260" role="img" aria-labelledby="title desc">
 <title id="title">Work-item link status synchronisation</title><desc id="desc">A finding's authorized link to a provider ticket is checked by a scheduled or new sync worker, which stores the resulting status or error against the link.</desc>
