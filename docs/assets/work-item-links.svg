  <symbol id="ico-gitlab" viewBox="0 0 24 24"><path fill="#FC6D26" d="M22.65 14.39L12 22.13 1.35 14.39a.84.84 0 0 1-.3-.94l1.22-3.78 2.44-7.51A.42.42 0 0 1 4.82 2a.43.43 0 0 1 .11.18l2.44 7.49h8.98l2.44-7.51A.42.42 0 0 1 19.18 2a.43.43 0 0 1 .11.18l2.44 7.51L23 13.45a.84.84 0 0 1-.35.94z"/></symbol>
