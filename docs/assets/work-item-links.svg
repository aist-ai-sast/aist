 <circle cx="709" cy="113" r="13" class="chip"/><use href="#ico-refresh" x="700" y="104" width="18" height="18" aria-hidden="true"/>
 <rect x="820" y="95" width="150" height="80" class="b" fill="#eaf8f1" stroke="#4d9874"/><text x="846" y="130" class="t">Stored state</text><text x="846" y="153" class="s">status or error</text>
 <circle cx="939" cy="113" r="13" class="chip"/><use href="#ico-check-circle" x="930" y="104" width="18" height="18" aria-hidden="true"/>
 <text x="40" y="225" class="s">Ticket status is shown with the finding but never changes its disposition.</text>
</svg>
