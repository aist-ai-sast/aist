<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="440" viewBox="0 0 1160 440" role="img" aria-labelledby="title desc">
 <title id="title">Canonical deduplication decision flow</title><desc id="desc">Two findings in the same product pass a hard gate on normalized file path and line. Findings that pass are scored on CWE, canonical family, rule, and component match; the score against configured thresholds decides duplicate, candidate, or unchanged.</desc>
 <defs>
  <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#52616b"/></marker>
  <style>text{font-family:Arial,sans-serif;fill:#17212b}.h{font-size:20px;font-weight:700}.t{font-size:15px;font-weight:700}.s{font-size:12.5px;fill:#52616b}.b{stroke:#52616b;stroke-width:1.5;rx:12}.l{stroke:#52616b;stroke-width:2;fill:none;marker-end:url(#a)}.d{stroke:#8b98a4;stroke-width:1.5;stroke-dasharray:6 5;fill:none;marker-end:url(#a)}.chip{fill:#ffffff;fill-opacity:.9;stroke:#d4dce3;stroke-width:1}</style>
  <symbol id="ico-filter" viewBox="0 0 24 24"><path fill="none" stroke="#7d69aa" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M3 4h18l-7 8v6l-4 2v-8z"/></symbol>
  <symbol id="ico-x-circle" viewBox="0 0 24 24"><path fill="none" stroke="#8b98a4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20zM15 9l-6 6M9 9l6 6"/></symbol>
  <symbol id="ico-list-check" viewBox="0 0 24 24"><path fill="none" stroke="#9e751d" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M9 6h11M9 12h11M9 18h11M4 6l1 1 2-2M4 12l1 1 2-2M4 18l1 1 2-2"/></symbol>
  <symbol id="ico-sliders" viewBox="0 0 24 24"><path fill="none" stroke="#7d69aa" stroke-width="1.8" stroke-linecap="round" d="M2 6h22M2 12h22M2 18h22"/><circle cx="14" cy="6" r="2.2" fill="#7d69aa"/><circle cx="8" cy="12" r="2.2" fill="#7d69aa"/><circle cx="17" cy="18" r="2.2" fill="#7d69aa"/></symbol>
  <symbol id="ico-check-circle" viewBox="0 0 24 24"><path fill="none" stroke="#4d9874" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20zM7.5 12l3 3 6-6.5"/></symbol>
  <symbol id="ico-tag" viewBox="0 0 24 24"><path fill="none" stroke="#9e751d" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M2 4h8l12 12-8 8L2 12V4z"/><circle cx="7" cy="9" r="1.4" fill="#9e751d" stroke="none"/></symbol>
  <symbol id="ico-minus-circle" viewBox="0 0 24 24"><path fill="none" stroke="#8b98a4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20zM7 12h10"/></symbol>
 </defs>
 <rect width="1160" height="440" fill="#fbfcfd"/>
 <text x="50" y="44" class="h">A duplicate/candidate decision, not a synchronous rerun</text>
 <text x="50" y="66" class="s">Runs during import and via the recompute_aist_duplicates management command.</text>

 <rect x="50" y="100" width="200" height="60" class="b" fill="#edf5ff"/><text x="70" y="126" class="t">Two findings</text><text x="70" y="148" class="s">same product, any tool</text>
 <path d="M250 130L300 130" class="l"/>
 <rect x="300" y="100" width="230" height="60" class="b" fill="#f4efff" stroke="#7d69aa"/><text x="322" y="126" class="t">Hard gate</text><text x="322" y="148" class="s">same normalized file_path + line?</text>
 <circle cx="500" cy="117" r="13" class="chip"/><use href="#ico-filter" x="491" y="108" width="18" height="18"/>

 <path d="M415 160L415 200" class="d"/><text x="440" y="180" class="s">no</text>
 <rect x="300" y="200" width="230" height="56" class="b" fill="#f7f9fb" stroke="#d4dce3"/><text x="322" y="224" class="t">Ineligible for canonical match</text><text x="322" y="245" class="s">falls back to the configured dedupe path</text>

 <path d="M530 130L590 130" class="l"/><text x="540" y="120" class="s">yes</text>
 <rect x="590" y="80" width="290" height="120" class="b" fill="#fff8e8" stroke="#9e751d"/><text x="612" y="105" class="t">Score signals</text>
 <circle cx="850" cy="97" r="13" class="chip"/><use href="#ico-list-check" x="841" y="88" width="18" height="18"/>
 <text x="612" y="128" class="s">+3 same non-zero CWE</text>
 <text x="612" y="148" class="s">+3 same canonical family</text>
 <text x="612" y="168" class="s">+2 same normalized rule</text>
 <text x="612" y="188" class="s">+1 same component name or version</text>

 <path d="M735 200L735 230" class="l"/>
 <rect x="590" y="230" width="290" height="56" class="b" fill="#f4efff" stroke="#7d69aa"/><text x="612" y="254" class="t">Compare to thresholds</text><text x="612" y="275" class="s">auto-duplicate vs. candidate-min-score</text>
 <circle cx="850" cy="247" r="13" class="chip"/><use href="#ico-sliders" x="841" y="238" width="18" height="18"/>

 <path d="M660 286L590 330" class="l"/><path d="M735 286L735 330" class="l"/><path d="M810 286L1000 330" class="l"/>

 <rect x="490" y="330" width="200" height="66" class="b" fill="#eaf8f1" stroke="#4d9874"/><text x="512" y="356" class="t">Duplicate</text><text x="512" y="378" class="s">score ≥ auto-duplicate threshold</text>
 <circle cx="662" cy="347" r="13" class="chip"/><use href="#ico-check-circle" x="653" y="338" width="18" height="18"/>
 <rect x="700" y="330" width="200" height="66" class="b" fill="#fff8e8" stroke="#9e751d"/><text x="722" y="356" class="t">Candidate</text><text x="722" y="378" class="s">positive, ≥ candidate-min-score</text>
 <circle cx="872" cy="347" r="13" class="chip"/><use href="#ico-tag" x="863" y="338" width="18" height="18"/>
 <rect x="910" y="330" width="200" height="66" class="b" fill="#f7f9fb" stroke="#d4dce3"/><text x="932" y="356" class="t">Left unchanged</text><text x="932" y="378" class="s">below both thresholds</text>
 <circle cx="1082" cy="347" r="13" class="chip"/><use href="#ico-minus-circle" x="1073" y="338" width="18" height="18"/>

 <text x="50" y="420" class="s">A candidate is not applied as a duplicate unless candidate application is explicitly enabled; matching never crosses products.</text>
</svg>
