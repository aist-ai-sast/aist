 <path d="M240 152L290 152M480 152L530 152M720 152L770 152M385 208L385 286M865 208L745 286" class="line"/>
 <text x="50" y="448" class="s">Every entry is maintained as: protected outcome → threat → implemented barrier → validation work.</text>
