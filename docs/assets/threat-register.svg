<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="500" viewBox="0 0 1160 500" role="img" aria-labelledby="title desc">
 <title id="title">AIST public threat register</title><desc id="desc">The public threat register connects protected assets to trust boundaries, security properties, residual operator responsibilities, and private vulnerability reporting.</desc>
 <defs><style>text{font-family:Arial,sans-serif;fill:#17212b}.h{font-size:20px;font-weight:700}.t{font-size:15px;font-weight:700}.s{font-size:13px;fill:#52616b}.b{stroke:#52616b;stroke-width:1.5;rx:12}.line{stroke:#8b98a4;stroke-width:1.5;stroke-dasharray:6 5;fill:none}.chip{fill:#ffffff;fill-opacity:.9;stroke:#d4dce3;stroke-width:1}</style>
  <symbol id="ico-users" viewBox="0 0 24 24"><path fill="none" stroke="#52616b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M9 11a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM2 20a7 7 0 0 1 14 0M17 5.5a3 3 0 0 1 0 5.8M22 20a7 7 0 0 0-4.7-6.6"/></symbol>
  <symbol id="ico-folder" viewBox="0 0 24 24"><path fill="none" stroke="#4d9874" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M3 7a1 1 0 0 1 1-1h5l2 2h9a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V7z"/></symbol>
  <symbol id="ico-key" viewBox="0 0 24 24"><path fill="none" stroke="#9e751d" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M15 7a4 4 0 1 1-3.9 5H8v2H6v2H3v-3l5.1-5.1A4 4 0 0 1 15 7z"/><circle cx="15.5" cy="6.5" r="0.9" fill="#9e751d" stroke="none"/></symbol>
  <symbol id="ico-shield" viewBox="0 0 24 24"><path fill="none" stroke="#b86161" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M12 2 4 5.5v6c0 5 3.5 9 8 11 4.5-2 8-6 8-11v-6z"/></symbol>
  <symbol id="ico-tag" viewBox="0 0 24 24"><path fill="none" stroke="#7d69aa" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M2 4h8l12 12-8 8L2 12V4z"/><circle cx="7" cy="9" r="1.4" fill="#7d69aa" stroke="none"/></symbol>
  <symbol id="ico-envelope" viewBox="0 0 24 24"><path fill="none" stroke="#7d69aa" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M4 5h16a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1zm0 0 8 7 8-7"/></symbol>
 </defs>
 <rect width="1160" height="500" fill="#fbfcfd"/><text x="50" y="54" class="h">Public security model: stable boundaries, not active vulnerability details</text>
 <rect x="50" y="96" width="190" height="112" class="b" fill="#edf5ff"/><text x="76" y="132" class="t">Protected assets</text><text x="76" y="156" class="s">tenant source, findings,</text><text x="76" y="180" class="s">credentials, scan authority</text>
 <circle cx="219" cy="113" r="13" class="chip"/><use href="#ico-users" x="210" y="104" width="18" height="18"/>
 <rect x="290" y="96" width="190" height="112" class="b" fill="#eaf8f1" stroke="#4d9874"/><text x="316" y="132" class="t">Trust boundaries</text><text x="316" y="156" class="s">tenant, provider, worker,</text><text x="316" y="180" class="s">network, container runtime</text>
 <circle cx="459" cy="113" r="13" class="chip"/><use href="#ico-folder" x="450" y="104" width="18" height="18"/>
 <rect x="530" y="96" width="190" height="112" class="b" fill="#fff8e8" stroke="#9e751d"/><text x="556" y="132" class="t">Security property</text><text x="556" y="156" class="s">what must remain true</text><text x="556" y="180" class="s">across each boundary</text>
 <circle cx="699" cy="113" r="13" class="chip"/><use href="#ico-key" x="690" y="104" width="18" height="18"/>
 <rect x="770" y="96" width="190" height="112" class="b" fill="#fff0f0" stroke="#b86161"/><text x="796" y="132" class="t">Residual trust</text><text x="796" y="156" class="s">operator and deployment</text><text x="796" y="180" class="s">responsibility</text>
 <circle cx="939" cy="113" r="13" class="chip"/><use href="#ico-shield" x="930" y="104" width="18" height="18"/>
 <rect x="290" y="286" width="260" height="112" class="b" fill="#f4efff" stroke="#7d69aa"/><text x="316" y="322" class="t">Public documentation</text><text x="316" y="346" class="s">design model and durable</text><text x="316" y="370" class="s">limitations</text>
 <circle cx="459" cy="303" r="13" class="chip"/><use href="#ico-tag" x="450" y="294" width="18" height="18"/>
 <rect x="610" y="286" width="300" height="112" class="b" fill="#f4efff" stroke="#7d69aa"/><text x="636" y="322" class="t">Private security advisory</text><text x="636" y="346" class="s">exploit details, affected paths,</text><text x="636" y="370" class="s">remediation and disclosure</text>
 <circle cx="819" cy="303" r="13" class="chip"/><use href="#ico-envelope" x="810" y="294" width="18" height="18"/>
 <path d="M240 152L290 152M480 152L530 152M720 152L770 152M385 208L420 286M865 208L760 286" class="line"/>
 <text x="50" y="448" class="s">Suspected vulnerabilities move to the private path; public pages are updated when coordinated disclosure is safe.</text>
</svg>
