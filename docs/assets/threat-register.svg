 <circle cx="459" cy="303" r="13" class="chip"/><use href="#ico-tag" x="450" y="294" width="18" height="18"/>
 <rect x="650" y="286" width="190" height="112" class="b" fill="#f4efff" stroke="#7d69aa"/><text x="676" y="322" class="t">Delivery</text><text x="676" y="346" class="s">work items and</text><text x="676" y="370" class="s">notifications</text>
