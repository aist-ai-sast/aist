<svg xmlns="http://www.w3.org/2000/svg" width="1450" height="450" viewBox="0 0 1450 450" role="img" aria-labelledby="title desc">
  <title id="title">AIST documentation map</title>
  <desc id="desc">The documentation starts with product workflows. Those lead to focused data flows, then to architecture and security pages.</desc>
  <defs>
   <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><path d="M0 0L10 3.5 0 7z" fill="#52616b"/></marker>
   <style>.box{stroke-width:2}.head{font:700 19px Arial;fill:#17212b;text-anchor:middle}.body{font:14px Arial;fill:#52616b;text-anchor:middle}.line{stroke:#52616b;stroke-width:2.5;fill:none;marker-end:url(#arrow)}</style>
   <symbol id="ico-users" viewBox="0 0 24 24"><path fill="none" stroke="#52616b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M9 11a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM2 20a7 7 0 0 1 14 0M17 5.5a3 3 0 0 1 0 5.8M22 20a7 7 0 0 0-4.7-6.6"/></symbol>
   <symbol id="ico-refresh" viewBox="0 0 24 24"><path fill="none" stroke="#9e751d" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M3 12a9 9 0 0 1 15-6.7L21 8M21 3v5h-5M21 12a9 9 0 0 1-15 6.7L3 16M3 21v-5h5"/></symbol>
   <symbol id="ico-layers" viewBox="0 0 24 24"><path fill="none" stroke="#4d9874" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M12 2 2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></symbol>
   <symbol id="ico-shield" viewBox="0 0 24 24"><path fill="none" stroke="#7d69aa" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M12 2 4 5.5v6c0 5 3.5 9 8 11 4.5-2 8-6 8-11v-6z"/></symbol>
  </defs>
  <rect width="1450" height="450" fill="#fff"/>
  <text x="48" y="44" font-family="Arial" font-size="26" font-weight="700" fill="#17212b">AIST documentation map</text>
  <text x="48" y="70" font-family="Arial" font-size="15" fill="#52616b">Follow the question, not a source-code directory.</text>

  <rect class="box" x="80" y="160" width="255" height="136" rx="14" fill="#edf5ff" stroke="#52616b"/>
  <use href="#ico-users" x="198" y="172" width="18" height="18"/>
  <text class="head" x="207" y="216">Product workflows</text><text class="body" x="207" y="238">what a user can achieve</text><text class="body" x="207" y="260">and observe in AIST</text>

  <rect class="box" x="470" y="160" width="255" height="136" rx="14" fill="#fff8e8" stroke="#9e751d"/>
  <use href="#ico-refresh" x="588" y="172" width="18" height="18"/>
  <text class="head" x="597" y="216">Data flows</text><text class="body" x="597" y="238">how one trigger reaches</text><text class="body" x="597" y="260">a durable outcome</text>

  <rect class="box" x="860" y="160" width="255" height="136" rx="14" fill="#eaf8f1" stroke="#4d9874"/>
  <use href="#ico-layers" x="978" y="172" width="18" height="18"/>
  <text class="head" x="987" y="216">Architecture</text><text class="body" x="987" y="238">which internal blocks</text><text class="body" x="987" y="260">own each responsibility</text>

  <rect class="box" x="1250" y="160" width="125" height="136" rx="14" fill="#f4efff" stroke="#7d69aa"/>
  <use href="#ico-shield" x="1303" y="172" width="18" height="18"/>
  <text class="head" x="1312" y="216">Security</text><text class="body" x="1312" y="238">boundaries</text><text class="body" x="1312" y="260">and threats</text>

  <path class="line" d="M335 228H470"/><path class="line" d="M725 228H860"/><path class="line" d="M1115 228H1250"/>
</svg>
