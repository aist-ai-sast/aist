<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="530" viewBox="0 0 1200 530" role="img" aria-labelledby="title desc">
  <title id="title">AIST documentation map</title>
  <desc id="desc">Reader questions lead to five documentation areas: product concepts, tasks and integrations, architecture and data flows, operations, and security.</desc>
  <defs>
    <style>
      .box{stroke-width:2}.head{font:700 18px Arial;fill:#17212b;text-anchor:middle}
      .body{font:14px Arial;fill:#52616b;text-anchor:middle}.line{stroke:#9aa6b2;stroke-width:2;fill:none}
      .label{font:700 21px Arial;fill:#17212b;text-anchor:middle}.small{font:14px Arial;fill:#52616b;text-anchor:middle}
    </style>
  </defs>
  <rect width="1200" height="530" fill="#fff"/>
  <text x="48" y="44" font-family="Arial" font-size="26" font-weight="700" fill="#17212b">AIST documentation map</text>
  <text x="48" y="70" font-family="Arial" font-size="15" fill="#52616b">Follow the reader's question, not a source-code directory or change history.</text>

  <path class="line" d="M600 310L290 182M600 310L910 182M600 310L290 438M600 310L910 438M600 310V115"/>

  <rect x="430" y="235" width="340" height="150" rx="26" fill="#17212b"/>
  <text class="label" x="600" y="292" fill="#fff" style="fill:#fff">What does the reader</text>
  <text class="label" x="600" y="320" fill="#fff" style="fill:#fff">need to understand or do?</text>
  <text class="small" x="600" y="351" fill="#dce5ec" style="fill:#dce5ec">Start at one canonical page</text>

  <rect class="box" x="445" y="90" width="310" height="90" rx="14" fill="#edf5ff" stroke="#52616b"/>
  <text class="head" x="600" y="125">Product concepts</text><text class="body" x="600" y="150">capabilities and user-visible behavior</text>

  <rect class="box" x="90" y="135" width="300" height="95" rx="14" fill="#fff8e8" stroke="#9e751d"/>
  <text class="head" x="240" y="172">Tasks and integrations</text><text class="body" x="240" y="198">setup and provider-specific workflows</text>

  <rect class="box" x="810" y="135" width="300" height="95" rx="14" fill="#eaf8f1" stroke="#4d9874"/>
  <text class="head" x="960" y="172">Architecture and data flows</text><text class="body" x="960" y="198">responsibilities, boundaries, sequence</text>

  <rect class="box" x="90" y="390" width="300" height="95" rx="14" fill="#f7f3e8" stroke="#9e751d"/>
  <text class="head" x="240" y="427">Operations</text><text class="body" x="240" y="453">commands, recovery, and rollout</text>

  <rect class="box" x="810" y="390" width="300" height="95" rx="14" fill="#f4efff" stroke="#7d69aa"/>
  <text class="head" x="960" y="427">Security</text><text class="body" x="960" y="453">roles, trust boundaries, assumptions</text>
</svg>
