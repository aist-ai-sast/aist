<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="670" viewBox="0 0 1500 670" role="img" aria-labelledby="title desc">
  <title id="title">AIST pipeline execution lifecycle</title>
  <desc id="desc">Every interactive, configured, scheduled, or webhook start creates a durable launch request. Admission acquires capacity and creates an admitted pipeline with a durable publish intent. A worker accepts one generic task, moves the pipeline to executing, selects SAST or DAST, imports results, and prepares findings for review.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0L9 4L0 8Z" fill="#596a78"/></marker>
    <style>text{font-family:Arial,sans-serif;fill:#17212b}.title{font-size:26px;font-weight:700}.zone-title{font-size:15px;font-weight:700;fill:#52616b}.head{font-size:17px;font-weight:700;text-anchor:middle}.body{font-size:13px;fill:#52616b;text-anchor:middle}.foot{font-size:13px;fill:#52616b}.zone{fill:#f7f9fb;stroke:#d4dce3;stroke-width:1.5}.box{stroke:#52616b;stroke-width:1.7}.flow{fill:none;stroke:#596a78;stroke-width:2.2;marker-end:url(#arrow)}.join{fill:none;stroke:#7d69aa;stroke-width:1.8;stroke-dasharray:7 5;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1500" height="670" fill="#ffffff"/>
  <text x="45" y="45" class="title">Pipeline execution</text>
  <text x="45" y="72" class="foot">Durable admission is separate from worker execution; PostgreSQL remains authoritative across broker retries.</text>

  <rect x="35" y="100" width="1430" height="205" rx="16" class="zone"/>
  <text x="58" y="128" class="zone-title">DURABLE ADMISSION</text>

  <rect x="65" y="160" width="175" height="92" rx="12" class="box" fill="#edf5ff"/>
  <text x="152" y="191" class="head">Start</text>
  <text x="152" y="216" class="body">direct · saved · schedule</text>
  <text x="152" y="236" class="body">verified SCM event</text>

  <rect x="285" y="160" width="185" height="92" rx="12" class="box" fill="#fff8e8"/>
  <text x="377" y="191" class="head">Launch request</text>
  <text x="377" y="216" class="body">secret-free frozen intent</text>
  <text x="377" y="236" class="body">waiting and retry state</text>

  <rect x="515" y="150" width="205" height="112" rx="12" class="box" fill="#fff8e8"/>
  <text x="617" y="182" class="head">Admission</text>
  <text x="617" y="207" class="body">authority · readiness</text>
  <text x="617" y="227" class="body">capacity lease · plan</text>
  <text x="617" y="247" class="body">coalesce duplicates</text>

  <rect x="765" y="150" width="205" height="112" rx="12" class="box" fill="#f4efff" stroke="#7d69aa"/>
  <text x="867" y="182" class="head">Admitted pipeline</text>
  <text x="867" y="207" class="body">capacity already held</text>
  <text x="867" y="227" class="body">not started yet</text>
  <text x="867" y="247" class="body">durable run history</text>

  <rect x="1015" y="160" width="190" height="92" rx="12" class="box" fill="#eaf8f1" stroke="#4d9874"/>
  <text x="1110" y="191" class="head">Publish intent</text>
  <text x="1110" y="216" class="body">recoverable outbox</text>
  <text x="1110" y="236" class="body">pipeline identity only</text>

  <rect x="1250" y="160" width="175" height="92" rx="12" class="box" fill="#f4efff" stroke="#7d69aa"/>
  <text x="1337" y="191" class="head">Broker delivery</text>
  <text x="1337" y="216" class="body">generic worker task</text>
  <text x="1337" y="236" class="body">safe to republish</text>

  <path d="M240 206H285M470 206H515M720 206H765M970 206H1015M1205 206H1250" class="flow"/>

  <rect x="35" y="330" width="1430" height="285" rx="16" class="zone"/>
  <text x="58" y="358" class="zone-title">EXECUTE AND PREPARE RESULTS</text>

  <rect x="65" y="405" width="180" height="92" rx="12" class="box" fill="#f4efff" stroke="#7d69aa"/>
  <text x="155" y="436" class="head">Worker accepts</text>
  <text x="155" y="461" class="body">matching delivery once</text>
  <text x="155" y="481" class="body">pipeline → Executing</text>

  <rect x="290" y="405" width="190" height="92" rx="12" class="box" fill="#f4efff" stroke="#7d69aa"/>
  <text x="385" y="436" class="head">Runtime registry</text>
  <text x="385" y="461" class="body">reload frozen state</text>
  <text x="385" y="481" class="body">select execution path</text>

  <rect x="525" y="370" width="175" height="82" rx="12" class="box" fill="#fff8e8" stroke="#9e751d"/>
  <text x="612" y="402" class="head">SAST</text>
  <text x="612" y="427" class="body">workspace · analyzers</text>
  <rect x="525" y="485" width="175" height="82" rx="12" class="box" fill="#eaf3f7" stroke="#3f7d92"/>
  <text x="612" y="517" class="head">DAST</text>
  <text x="612" y="542" class="body">connector · gateway</text>

  <rect x="760" y="405" width="175" height="92" rx="12" class="box" fill="#eaf8f1" stroke="#4d9874"/>
  <text x="847" y="436" class="head">Import</text>
  <text x="847" y="461" class="body">validate result</text>
  <text x="847" y="481" class="body">tests · findings</text>

  <rect x="980" y="405" width="190" height="92" rx="12" class="box" fill="#eaf8f1" stroke="#4d9874"/>
  <text x="1075" y="436" class="head">Post-process</text>
  <text x="1075" y="461" class="body">deduplicate · enrich</text>
  <text x="1075" y="481" class="body">identify regressions</text>

  <rect x="1215" y="370" width="205" height="82" rx="12" class="box" fill="#eaf8f1" stroke="#4d9874"/>
  <text x="1317" y="402" class="head">Finished</text>
  <text x="1317" y="427" class="body">no findings or warning</text>
  <rect x="1215" y="485" width="205" height="82" rx="12" class="box" fill="#f4efff" stroke="#7d69aa"/>
  <text x="1317" y="517" class="head">Review</text>
  <text x="1317" y="542" class="body">human or AI-assisted</text>

  <path d="M1337 252V292H155V405" class="flow"/>
  <path d="M245 451H290M480 435C500 425 505 411 525 411M480 467C500 480 505 526 525 526" class="flow"/>
  <path d="M700 411C730 411 730 435 760 435M700 526C730 526 730 467 760 467" class="flow"/>
  <path d="M935 451H980M1170 435C1190 425 1195 411 1215 411M1170 467C1190 480 1195 526 1215 526" class="flow"/>

  <rect x="760" y="535" width="175" height="55" rx="11" class="box" fill="#edf5ff"/>
  <text x="847" y="558" class="head" style="font-size:15px">Manual import</text>
  <text x="847" y="578" class="body">validated report</text>
  <path d="M935 562H950V497H900" class="join"/>

  <text x="45" y="646" class="foot">A failure after pipeline creation ends in Finished with warnings; the pipeline, logs, and available outcome remain in history.</text>
</svg>
