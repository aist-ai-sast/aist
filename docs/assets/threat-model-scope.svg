<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="550" viewBox="0 0 1160 550" role="img" aria-labelledby="title desc">
 <title id="title">AIST threat-model boundaries</title><desc id="desc">AIST user requests enter the application, which makes organization-scoped decisions. Workers cross into container execution and named connected systems. The diagram identifies the boundaries to evaluate rather than showing an operation sequence.</desc>
 <defs><style>text{font-family:Arial,sans-serif;fill:#17212b}.h{font-size:20px;font-weight:700}.t{font-size:15px;font-weight:700}.s{font-size:13px;fill:#52616b}.b{stroke:#52616b;stroke-width:1.5;rx:12}.zone{fill:none;stroke:#8b98a4;stroke-width:1.5;stroke-dasharray:7 5;rx:16}.line{stroke:#52616b;stroke-width:1.8;fill:none}.chip{fill:#ffffff;fill-opacity:.9;stroke:#d4dce3;stroke-width:1}</style>
  <symbol id="ico-users" viewBox="0 0 24 24"><path fill="none" stroke="#52616b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M9 11a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM2 20a7 7 0 0 1 14 0M17 5.5a3 3 0 0 1 0 5.8M22 20a7 7 0 0 0-4.7-6.6"/></symbol>
  <symbol id="ico-lock" viewBox="0 0 24 24"><path fill="none" stroke="#7d69aa" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M6 11V7a6 6 0 0 1 12 0v4M5 11h14a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1v-9a1 1 0 0 1 1-1z"/></symbol>
  <symbol id="ico-database" viewBox="0 0 24 24"><path fill="none" stroke="#4d9874" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M12 3c-4.4 0-8 1.3-8 3s3.6 3 8 3 8-1.3 8-3-3.6-3-8-3zM4 6v6c0 1.7 3.6 3 8 3s8-1.3 8-3V6M4 12v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"/></symbol>
  <symbol id="ico-key" viewBox="0 0 24 24"><path fill="none" stroke="#4d9874" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M15 7a4 4 0 1 1-3.9 5H8v2H6v2H3v-3l5.1-5.1A4 4 0 0 1 15 7z"/><circle cx="15.5" cy="6.5" r="0.9" fill="#4d9874" stroke="none"/></symbol>
  <symbol id="ico-refresh" viewBox="0 0 24 24"><path fill="none" stroke="#9e751d" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M3 12a9 9 0 0 1 15-6.7L21 8M21 3v5h-5M21 12a9 9 0 0 1-15 6.7L3 16M3 21v-5h5"/></symbol>
  <symbol id="ico-shield" viewBox="0 0 24 24"><path fill="none" stroke="#b86161" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M12 2 4 5.5v6c0 5 3.5 9 8 11 4.5-2 8-6 8-11v-6z"/></symbol>
 </defs>
 <rect width="1160" height="550" fill="#fbfcfd"/><text x="50" y="54" class="h">Boundaries evaluated by the AIST threat model</text>
 <rect x="50" y="88" width="260" height="390" class="zone"/><text x="78" y="122" class="h">Request boundary</text><rect x="78" y="152" width="204" height="70" class="b" fill="#edf5ff"/><text x="104" y="184" class="t">AIST user interface</text><text x="104" y="206" class="s">authenticated request</text>
 <circle cx="253" cy="170" r="12" class="chip"/><use href="#ico-users" x="245" y="162" width="16" height="16"/>
 <rect x="78" y="270" width="204" height="102" class="b" fill="#f4efff" stroke="#7d69aa"/><text x="104" y="306" class="t">Django application</text><text x="104" y="330" class="s">authorisation and API</text><text x="104" y="352" class="s">serializer validation</text>
 <circle cx="253" cy="288" r="12" class="chip"/><use href="#ico-lock" x="245" y="280" width="16" height="16"/>
 <rect x="366" y="88" width="320" height="390" class="zone"/><text x="394" y="122" class="h">Tenant data boundary</text><rect x="394" y="152" width="264" height="92" class="b" fill="#eaf8f1" stroke="#4d9874"/><text x="420" y="186" class="t">Org-scoped records</text><text x="420" y="210" class="s">projects · pipelines · findings</text>
 <circle cx="633" cy="170" r="12" class="chip"/><use href="#ico-database" x="625" y="162" width="16" height="16"/>
 <rect x="394" y="294" width="264" height="92" class="b" fill="#eaf8f1" stroke="#4d9874"/><text x="420" y="328" class="t">Credentials and source</text><text x="420" y="352" class="s">archives · integration secrets</text>
 <circle cx="633" cy="312" r="12" class="chip"/><use href="#ico-key" x="625" y="304" width="16" height="16"/>
 <rect x="742" y="88" width="368" height="390" class="zone"/><text x="770" y="122" class="h">Execution and connection boundary</text><rect x="770" y="152" width="312" height="70" class="b" fill="#fff8e8" stroke="#9e751d"/><text x="796" y="184" class="t">Celery workers</text><text x="796" y="206" class="s">queued operations, schedulers</text>
 <circle cx="1057" cy="170" r="12" class="chip"/><use href="#ico-refresh" x="1049" y="162" width="16" height="16"/>
 <rect x="770" y="270" width="142" height="92" class="b" fill="#fff0f0" stroke="#b86161"/><text x="794" y="306" class="t">SAST/VPN</text><text x="794" y="330" class="s">containers</text>
 <circle cx="885" cy="288" r="12" class="chip"/><use href="#ico-shield" x="877" y="280" width="16" height="16"/>
 <rect x="940" y="270" width="142" height="92" class="b" fill="#fff0f0" stroke="#b86161"/><text x="958" y="302" class="t">Named</text><text x="958" y="324" class="t">connections</text><text x="958" y="346" class="s">SCM · n8n · bridge</text>
 <path d="M180 222L180 270M282 321L394 198M526 244L526 294M658 198L770 187M926 222L841 270M926 222L1010 270" class="line"/>
 <text x="50" y="520" class="s">The diagram identifies where threats are assessed. Operation pages supply the direction and data for each individual flow.</text>
</svg>
