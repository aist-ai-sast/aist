<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="570" viewBox="0 0 1160 570" role="img" aria-labelledby="title desc">
  <title id="title">AIST public threat-model boundaries</title>
  <desc id="desc">Untrusted users, source, and reports enter the AIST control plane. Authorized state is stored within an organization data boundary. Workers cross a privileged container-runtime boundary and communicate with organization-owned external providers through direct or VPN-routed connections.</desc>
  <defs>
    <style>text{font-family:Arial,sans-serif;fill:#17212b}.title{font-size:22px;font-weight:700}.group{font-size:17px;font-weight:700}.name{font-size:15px;font-weight:700}.detail{font-size:12.5px;fill:#52616b}.boundary{fill:#f7f9fb;stroke:#8fa0b0;stroke-width:1.6;stroke-dasharray:8 6;rx:16}.box{stroke:#52616b;stroke-width:1.5;rx:11}.flow{fill:none;stroke:#596a78;stroke-width:2;marker-end:url(#arrow)}.priv{fill:none;stroke:#b86161;stroke-width:2;stroke-dasharray:7 5;marker-end:url(#arrow)}</style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#596a78"/></marker>
  </defs>
  <rect width="1160" height="570" fill="#fbfcfd"/>
  <text x="50" y="47" class="title">AIST threat-model boundaries</text>
  <text x="50" y="70" class="detail">Arrows cross a boundary where identity, ownership, input, or runtime trust must be checked.</text>

  <rect x="35" y="125" width="150" height="84" class="box" fill="#fff0f0"/>
  <text x="60" y="156" class="name">Untrusted inputs</text><text x="60" y="179" class="detail">users · source</text><text x="60" y="198" class="detail">reports · callbacks</text>

  <rect x="220" y="96" width="260" height="190" class="boundary"/>
  <text x="245" y="126" class="group">Request boundary</text>
  <rect x="255" y="150" width="190" height="92" class="box" fill="#edf5ff"/>
  <text x="280" y="179" class="name">AIST control plane</text><text x="280" y="202" class="detail">authentication · validation</text><text x="280" y="222" class="detail">authorization · workflow</text>
  <path d="M185 167L255 185" class="flow"/>

  <rect x="520" y="96" width="260" height="190" class="boundary"/>
  <text x="545" y="126" class="group">Tenant data boundary</text>
  <rect x="555" y="150" width="190" height="92" class="box" fill="#eaf8f1"/>
  <text x="580" y="179" class="name">Organization state</text><text x="580" y="202" class="detail">projects · findings</text><text x="580" y="222" class="detail">credentials · authority</text>
  <path d="M445 195L555 195" class="flow"/>

  <rect x="220" y="330" width="560" height="175" class="boundary"/>
  <text x="245" y="360" class="group">Asynchronous and container-runtime boundary</text>
  <rect x="260" y="388" width="190" height="78" class="box" fill="#f4efff"/>
  <text x="285" y="418" class="name">Celery workers</text><text x="285" y="441" class="detail">revalidate durable state</text>
  <rect x="535" y="388" width="205" height="78" class="box" fill="#fff8e8"/>
  <text x="560" y="418" class="name">Workload containers</text><text x="560" y="441" class="detail">SAST · connector · VPN</text>
  <path d="M650 242L395 388" class="flow"/>
  <path d="M450 427L535 427" class="priv"/><text x="466" y="414" class="detail">Docker control</text>

  <rect x="825" y="96" width="300" height="409" class="boundary"/>
  <text x="850" y="126" class="group">External provider boundary</text>
  <rect x="865" y="160" width="220" height="82" class="box" fill="#ffffff"/>
  <text x="890" y="190" class="name">SCM and work items</text><text x="890" y="214" class="detail">organization-owned connection</text>
  <rect x="865" y="286" width="220" height="82" class="box" fill="#ffffff"/>
  <text x="890" y="316" class="name">AI and notifications</text><text x="890" y="340" class="detail">direct outbound integration</text>
  <rect x="865" y="412" width="220" height="70" class="box" fill="#ffffff"/>
  <text x="890" y="442" class="name">DAST gateway</text><text x="890" y="465" class="detail">typed external execution</text>
  <path d="M745 195L865 201" class="flow"/>
  <path d="M740 427L865 447" class="flow"/>
  <text x="850" y="526" class="detail">Connections may be direct or use the explicitly</text>
  <text x="850" y="544" class="detail">selected organization VPN.</text>
</svg>
