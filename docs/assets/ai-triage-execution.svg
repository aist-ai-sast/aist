<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="560" viewBox="0 0 1160 560" role="img" aria-labelledby="title desc">
 <title id="title">AI triage execution through webhook or local bridge</title><desc id="desc">After manual or automatic selection, a pipeline uses the independently configured webhook or local CLI backend. Both routes persist AI finding responses. False positives close automatically; true positives and uncertain findings remain active.</desc>
