<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="780" viewBox="0 0 1100 780" role="img" aria-labelledby="title desc">
 <title id="title">AIST AI triage selection, execution backend, and finding disposition</title>
 <desc id="desc">After AIST prepares findings, one selection trigger chooses findings automatically or lets an authorized user select them manually. A separately configured backend then uses n8n or a local Claude CLI session. False positives close automatically; true positives and uncertain findings remain active.</desc>
 <defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#52616b"/></marker>
  <style>
   text{font-family:Arial,sans-serif;fill:#17212b}.h{font-size:25px;font-weight:700}.sub{font-size:15px;fill:#52616b}.sh{font-size:18px;font-weight:700}.t{font-size:15px;font-weight:700}.s{font-size:14px;fill:#52616b}.xs{font-size:13px;fill:#52616b}.lane{fill:#f7f9fb;stroke:#d4dce3;stroke-width:1.5;rx:16}.box{stroke:#667681;stroke-width:1.3;rx:12}.line{stroke:#52616b;stroke-width:1.8;fill:none;marker-end:url(#arrow)}.plain{stroke:#52616b;stroke-width:1.8;fill:none}.choice{font-size:13px;font-weight:700;fill:#6b54a3}
  </style>
  <symbol id="ready" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M7 12l3 3 7-7" fill="none" stroke="currentColor" stroke-width="2"/></symbol>
  <symbol id="auto" viewBox="0 0 24 24"><path d="M20 8a8 8 0 00-14-2L3 9m1-5L3 9l5 1M4 16a8 8 0 0014 2l3-3m-1 5l1-5-5-1" fill="none" stroke="currentColor" stroke-width="2"/></symbol>
  <symbol id="user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4" fill="none" stroke="currentColor" stroke-width="2"/><path d="M4 21c.8-5 3.5-7 8-7s7.2 2 8 7" fill="none" stroke="currentColor" stroke-width="2"/></symbol>
  <symbol id="filter" viewBox="0 0 24 24"><path d="M3 5h18l-7 8v6l-4 2v-8z" fill="none" stroke="currentColor" stroke-width="2"/></symbol>
  <symbol id="nodes" viewBox="0 0 24 24"><circle cx="5" cy="12" r="2.5" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="19" cy="6" r="2.5" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="19" cy="18" r="2.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M7.5 11l9-4M7.5 13l9 4" stroke="currentColor" stroke-width="2"/></symbol>
  <symbol id="terminal" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M7 9l3 3-3 3M12 15h5" fill="none" stroke="currentColor" stroke-width="2"/></symbol>
  <symbol id="socket" viewBox="0 0 24 24"><path d="M8 4v5M16 4v5M6 9h12v3a6 6 0 01-12 0zM12 18v4" fill="none" stroke="currentColor" stroke-width="2"/></symbol>
  <symbol id="close" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8 8l8 8M16 8l-8 8" stroke="currentColor" stroke-width="2"/></symbol>
  <symbol id="shield" viewBox="0 0 24 24"><path d="M12 2l8 3v6c0 5.2-3.4 9-8 11-4.6-2-8-5.8-8-11V5l8-3zM8.5 12l2.2 2.2 4.8-5" fill="none" stroke="currentColor" stroke-width="2"/></symbol>
  <symbol id="question" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M9.5 9a2.7 2.7 0 015.2.9c0 2-2.7 2.1-2.7 4.1M12 18h.01" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
 </defs>

 <rect width="1100" height="780" fill="#fbfcfd"/>
 <text x="40" y="44" class="h">AI triage applies two independent decisions</text>
 <text x="40" y="70" class="sub">First select the findings. Then execute the selected set through the configured backend.</text>

 <rect x="40" y="96" width="1020" height="72" class="lane"/>
 <g color="#287955"><use href="#ready" x="68" y="117" width="28" height="28"/></g>
 <text x="112" y="124" class="t">Findings are ready</text><text x="112" y="148" class="s">Report imported · duplicates resolved · source context enriched · regressions identified</text>

 <text x="40" y="208" class="sh">Decision 1 · How are findings selected?</text>
 <rect x="40" y="228" width="450" height="108" class="box" fill="#f4efff"/>
 <g color="#6b54a3"><use href="#auto" x="64" y="250" width="28" height="28"/></g><text x="108" y="258" class="t">Automatic selection</text>
 <text x="64" y="291" class="s">Runs after processing using rules saved with the launch.</text><text x="64" y="315" class="s">Already-triaged analyzer findings are excluded.</text>
 <rect x="610" y="228" width="450" height="108" class="box" fill="#f4efff"/>
 <g color="#6b54a3"><use href="#user" x="634" y="250" width="28" height="28"/></g><text x="678" y="258" class="t">Manual selection</text>
 <text x="634" y="291" class="s">Pipeline waits at the selection stage.</text><text x="634" y="315" class="s">An authorized user chooses findings from that pipeline.</text>
 <rect x="515" y="263" width="70" height="36" rx="18" fill="#ece5fb" stroke="#b9a7db"/><text x="530" y="286" class="choice">OR</text>
 <path d="M265 336v28h285M835 336v28H550M550 364v28" class="plain"/>

 <rect x="380" y="392" width="340" height="54" class="box" fill="#edf5ff"/>
 <g color="#315f9c"><use href="#filter" x="402" y="407" width="24" height="24"/></g><text x="440" y="425" class="t">One selected set of finding IDs</text>

 <text x="40" y="487" class="sh">Decision 2 · Which configured backend executes that set?</text>
 <rect x="40" y="525" width="450" height="106" class="box" fill="#fff8e8"/>
 <g color="#c64f8c"><use href="#nodes" x="64" y="547" width="28" height="28"/></g><text x="108" y="555" class="t">n8n webhook</text>
 <text x="64" y="588" class="s">AIST sends project context and finding IDs.</text><text x="64" y="612" class="s">The callback persists the AI responses.</text>
 <rect x="610" y="525" width="450" height="106" class="box" fill="#fff8e8"/>
 <g color="#d97745"><use href="#terminal" x="634" y="547" width="28" height="28"/></g><text x="678" y="555" class="t">Local Claude CLI</text>
 <text x="634" y="588" class="s">Worker → Unix socket → long-running bridge</text><text x="634" y="612" class="s">Fresh `claude -p` process, credential, source, and skill</text>
 <rect x="515" y="560" width="70" height="36" rx="18" fill="#fff0c9" stroke="#d8bb70"/><text x="530" y="583" class="choice">OR</text>
 <path d="M550 446v60H265v19M550 506h285v19" class="line"/>
 <path d="M265 631v28h285M835 631v28H550M550 659v20" class="plain"/>

 <text x="40" y="714" class="sh">Finding disposition</text>
 <rect x="40" y="728" width="320" height="40" rx="12" fill="#fff0f0" stroke="#c86a6a"/>
 <g color="#a84949"><use href="#close" x="56" y="736" width="24" height="24"/></g><text x="92" y="753" class="t">FP → closed automatically</text>
 <rect x="390" y="728" width="320" height="40" rx="12" fill="#eaf8f1" stroke="#4d9874"/>
 <g color="#287955"><use href="#shield" x="406" y="736" width="24" height="24"/></g><text x="442" y="753" class="t">True Positive → remains active</text>
 <rect x="740" y="728" width="320" height="40" rx="12" fill="#fff8e8" stroke="#d8bb70"/>
 <g color="#9e751d"><use href="#question" x="756" y="736" width="24" height="24"/></g><text x="792" y="753" class="t">Uncertain → remains active</text>
</svg>
