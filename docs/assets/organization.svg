 <use href="#ico-openvpn" x="592" y="260" width="15" height="15"/><text x="614" y="271" class="m">VPN</text>
 <use href="#ico-claude" x="442" y="284" width="15" height="15"/><text x="464" y="295" class="m">AI</text>
 <use href="#ico-shield" x="592" y="284" width="15" height="15"/><text x="614" y="295" class="m">DAST</text>
 <use href="#ico-slack" x="442" y="308" width="15" height="15"/><text x="464" y="319" class="m">Slack</text>
 <use href="#ico-envelope" x="592" y="308" width="15" height="15"/><text x="614" y="319" class="m">Email</text>
 <use href="#ico-tag" x="442" y="332" width="15" height="15"/><text x="464" y="343" class="m">Work items</text>
 <text x="442" y="365" class="s">credentials never copied to a project</text>

 <rect x="820" y="210" width="280" height="120" class="b" fill="#eaf8f1" stroke="#4d9874"/>
 <use href="#ico-folder" x="842" y="228" width="18" height="18"/><text x="868" y="243" class="t">Projects</text>
 <use href="#ico-play" x="842" y="260" width="15" height="15"/><text x="864" y="271" class="m">Versions and pipeline runs</text>
 <use href="#ico-bug" x="842" y="284" width="15" height="15"/><text x="864" y="295" class="m">Findings and launch config</text>
 <use href="#ico-clock" x="842" y="308" width="15" height="15"/><text x="864" y="319" class="m">Review history</text>

 <path d="M740 300L820 300" class="l"/>

 <text x="50" y="412" class="s">Organization configuration is resolved per project: a project selects an integration, overrides its non-secret settings, or disables it.</text>
 <text x="50" y="432" class="s">Full-member overrides only narrow access. Restricted-member grants define access and role for each selected project.</text>
</svg>
