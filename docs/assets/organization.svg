 <rect width="1160" height="460" fill="#fbfcfd"/>
 <text x="50" y="44" class="h">One tenant, one configuration, many projects</text>
 <text x="50" y="66" class="s">An organization represents one client and owns everything below it.</text>

 <rect x="460" y="100" width="240" height="50" class="b" fill="#edf5ff"/>
 <use href="#ico-briefcase" x="480" y="115" width="20" height="20"/>
 <text x="510" y="130" class="t">Organization</text>

 <path d="M540 150L200 210" class="l"/><path d="M580 150L580 210" class="l"/><path d="M660 150L960 210" class="l"/>

 <rect x="60" y="210" width="280" height="100" class="b" fill="#f4efff" stroke="#7d69aa"/>
 <use href="#ico-users" x="82" y="228" width="18" height="18"/><text x="108" y="243" class="t">Users</text>
 <use href="#ico-check-circle" x="82" y="260" width="16" height="16"/><text x="104" y="272" class="m">Full — role across all projects</text>
 <use href="#ico-lock" x="82" y="284" width="16" height="16"/><text x="104" y="296" class="m">Restricted — only granted projects</text>

