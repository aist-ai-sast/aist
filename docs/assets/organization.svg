<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="460" viewBox="0 0 1160 460" role="img" aria-labelledby="title desc">
 <title id="title">What an AIST organization owns</title><desc id="desc">An organization owns user membership, its configuration of integrations, and its projects. Projects resolve organization configuration per integration type by selecting, overriding non-secret settings, or disabling it.</desc>
