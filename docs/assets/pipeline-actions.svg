<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260" role="img" aria-labelledby="title desc">
 <title id="title">Pipeline action trigger and execution</title><desc id="desc">A launch configuration's trigger matches a pipeline status transition, which runs its action handler once and records an outcome on the pipeline.</desc>
 <defs>
  <style>text{font-family:Arial,sans-serif;fill:#17212b}.h{font-size:20px;font-weight:700}.t{font-size:15px}.s{font-size:13px;fill:#52616b}.b{stroke:#52616b;stroke-width:2;rx:12}.l{stroke:#52616b;stroke-width:2;fill:none}.chip{fill:#ffffff;fill-opacity:.9;stroke:#d4dce3;stroke-width:1}</style>
  <symbol id="ico-slack" viewBox="0 0 24 24"><path fill="#4A154B" d="M5.042 15.165a2.528 2.528 0 0 1-2.52 2.523A2.528 2.528 0 0 1 0 15.165a2.527 2.527 0 0 1 2.522-2.52h2.52v2.52zm1.271 0a2.527 2.527 0 0 1 2.521-2.52 2.527 2.527 0 0 1 2.521 2.52v6.313A2.528 2.528 0 0 1 8.834 24a2.528 2.528 0 0 1-2.521-2.522v-6.313zM8.834 5.042a2.528 2.528 0 0 1-2.521-2.52A2.528 2.528 0 0 1 8.834 0a2.528 2.528 0 0 1 2.521 2.522v2.52H8.834zm0 1.271a2.527 2.527 0 0 1 2.521 2.521 2.527 2.527 0 0 1-2.521 2.521H2.522A2.528 2.528 0 0 1 0 8.834a2.528 2.528 0 0 1 2.522-2.521h6.312zm10.123 2.521a2.528 2.528 0 0 1 2.522-2.521A2.528 2.528 0 0 1 24 8.834a2.528 2.528 0 0 1-2.522 2.521h-2.521V8.834zm-1.268 0a2.528 2.528 0 0 1-2.523 2.521 2.527 2.527 0 0 1-2.52-2.521V2.522A2.527 2.527 0 0 1 15.165 0a2.528 2.528 0 0 1 2.523 2.522v6.312zm-2.523 10.122a2.528 2.528 0 0 1 2.523 2.522A2.528 2.528 0 0 1 15.165 24a2.527 2.527 0 0 1-2.52-2.522v-2.521h2.52zm0-1.268a2.527 2.527 0 0 1-2.52-2.523 2.526 2.526 0 0 1 2.52-2.52h6.313A2.527 2.527 0 0 1 24 15.165a2.528 2.528 0 0 1-2.522 2.523h-6.313z"/></symbol>
  <symbol id="ico-email" viewBox="0 0 24 24"><path fill="none" stroke="#52616b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M4 5h16a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1zm0 0 8 7 8-7"/></symbol>
  <symbol id="ico-log" viewBox="0 0 24 24"><path fill="none" stroke="#52616b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8l-5-5Zm0 0v5h5M9 13h6M9 17h6"/></symbol>
  <symbol id="ico-sliders" viewBox="0 0 24 24"><path fill="none" stroke="#7d69aa" stroke-width="1.8" stroke-linecap="round" d="M2 6h22M2 12h22M2 18h22"/><circle cx="14" cy="6" r="2.2" fill="#7d69aa"/><circle cx="8" cy="12" r="2.2" fill="#7d69aa"/><circle cx="17" cy="18" r="2.2" fill="#7d69aa"/></symbol>
  <symbol id="ico-refresh" viewBox="0 0 24 24"><path fill="none" stroke="#52616b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M3 12a9 9 0 0 1 15-6.7L21 8M21 3v5h-5M21 12a9 9 0 0 1-15 6.7L3 16M3 21v-5h5"/></symbol>
  <symbol id="ico-check-circle" viewBox="0 0 24 24"><path fill="none" stroke="#4d9874" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20zM7.5 12l3 3 6-6.5"/></symbol>
 </defs>
 <rect width="1000" height="260" fill="#fbfcfd"/>
 <text x="40" y="42" class="h">Pipeline action trigger and execution</text>
 <path d="M220 135H300M480 135H560M770 135H820" class="l"/>
 <rect x="40" y="95" width="180" height="92" class="b" fill="#f4efff" stroke="#7d69aa"/><text x="64" y="130" class="t">Launch config</text><text x="64" y="153" class="s">type + trigger</text>
 <circle cx="189" cy="113" r="13" class="chip"/><use href="#ico-sliders" x="180" y="104" width="18" height="18" aria-hidden="true"/>
 <rect x="300" y="95" width="180" height="92" class="b" fill="#edf5ff"/><text x="325" y="130" class="t">Status transition</text><text x="325" y="153" class="s">matching status</text>
 <circle cx="465" cy="113" r="13" class="chip"/><use href="#ico-refresh" x="456" y="104" width="18" height="18" aria-hidden="true"/>
 <rect x="560" y="95" width="210" height="92" class="b" fill="#fff8e8" stroke="#9e751d"/><text x="590" y="130" class="t">Action handler</text><text x="590" y="153" class="s">runs once</text>
 <circle cx="709" cy="169" r="12" class="chip"/><use href="#ico-slack" x="700" y="160" width="18" height="18" aria-hidden="true"/>
 <circle cx="730" cy="169" r="12" class="chip"/><use href="#ico-email" x="721" y="160" width="18" height="18" aria-hidden="true"/>
 <circle cx="751" cy="169" r="12" class="chip"/><use href="#ico-log" x="742" y="160" width="18" height="18" aria-hidden="true"/>
 <rect x="820" y="95" width="150" height="92" class="b" fill="#eaf8f1" stroke="#4d9874"/><text x="844" y="130" class="t">Outcome</text><text x="844" y="153" class="s">on pipeline</text>
 <circle cx="939" cy="113" r="13" class="chip"/><use href="#ico-check-circle" x="930" y="104" width="18" height="18" aria-hidden="true"/>
 <text x="40" y="225" class="s">Current handlers: Slack, email, write-log. New types use the same trigger model.</text>
</svg>
