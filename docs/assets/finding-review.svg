<svg xmlns="http://www.w3.org/2000/svg" width="1450" height="670" viewBox="0 0 1450 670" role="img" aria-labelledby="title desc">
  <title id="title">Finding review decisions</title>
  <desc id="desc">A reviewer opens an authorised finding and can add notes, update severity, close it with a reason, mark a duplicate with a primary finding, or record and later revoke risk acceptance. Bulk actions use locks to avoid overlapping changes.</desc>
  <defs>
   <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><path d="M0 0L10 3.5 0 7z" fill="#52616b"/></marker>
   <style>.box{stroke-width:2}.head{font:700 17px Arial;fill:#17212b;text-anchor:middle}.body{font:14px Arial;fill:#52616b;text-anchor:middle}.line{stroke:#52616b;stroke-width:2.5;fill:none;marker-end:url(#arrow)}.decision{stroke:#7d69aa;stroke-width:2.5;fill:none;marker-end:url(#arrow)}.lane{fill:#f7f9fb;stroke:#d4dce3;stroke-width:2}.label{font:700 16px Arial;fill:#334155}</style>
   <symbol id="ico-bug" viewBox="0 0 24 24"><path fill="none" stroke="#52616b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M9 9V7a3 3 0 1 1 6 0v2M8 9h8a4 4 0 0 1 4 4v3a6 6 0 0 1-12 0v-3a4 4 0 0 1 4-4zM3 13h4M17 13h4M5.5 8l2 1.8M18.5 8l-2 1.8M5.5 19l2-1.8M18.5 19l-2-1.8"/></symbol>
   <symbol id="ico-search" viewBox="0 0 24 24"><path fill="none" stroke="#7d69aa" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14zM20.5 20.5l-4.3-4.3"/></symbol>
   <symbol id="ico-edit" viewBox="0 0 24 24"><path fill="none" stroke="#4d9874" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M17 3a2.83 2.83 0 0 1 4 4L7 21l-4 1 1-4z"/></symbol>
   <symbol id="ico-x-circle" viewBox="0 0 24 24"><path fill="none" stroke="#9e751d" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20zM15 9l-6 6M9 9l6 6"/></symbol>
   <symbol id="ico-archive" viewBox="0 0 24 24"><path fill="none" stroke="#9e751d" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M3 4h18v4H3zM5 8v11a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8M10 12h4"/></symbol>
   <symbol id="ico-shield" viewBox="0 0 24 24"><path fill="none" stroke="#7d69aa" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M12 2 4 5.5v6c0 5 3.5 9 8 11 4.5-2 8-6 8-11v-6z"/></symbol>
   <symbol id="ico-clock" viewBox="0 0 24 24"><path fill="none" stroke="#4d9874" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20zM12 6.5v6l4 2"/></symbol>
  </defs>
  <rect width="1450" height="670" fill="#fff"/>
  <text x="48" y="44" font-family="Arial" font-size="26" font-weight="700" fill="#17212b">Finding review decisions</text>
  <text x="48" y="70" font-family="Arial" font-size="15" fill="#52616b">A review changes the state of one retained finding; it does not rerun analysis.</text>

  <rect class="lane" x="45" y="115" width="1360" height="170" rx="16"/>
  <text class="label" x="72" y="147">Inspect and annotate</text>
  <rect class="box" x="130" y="160" width="215" height="95" rx="11" fill="#edf5ff" stroke="#52616b"/>
  <use href="#ico-bug" x="228" y="172" width="18" height="18"/>
  <text class="head" x="237" y="206">Authorised finding</text><text class="body" x="237" y="228">project and source context</text>
  <rect class="box" x="470" y="160" width="215" height="95" rx="11" fill="#f4efff" stroke="#7d69aa"/>
  <use href="#ico-search" x="568" y="172" width="18" height="18"/>
  <text class="head" x="577" y="206">Inspect and filter</text><text class="body" x="577" y="228">status, source, AI, work items</text>
  <rect class="box" x="810" y="160" width="215" height="95" rx="11" fill="#eaf8f1" stroke="#4d9874"/>
  <use href="#ico-edit" x="908" y="172" width="18" height="18"/>
  <text class="head" x="917" y="206">Update evidence</text><text class="body" x="917" y="228">notes or severity</text>
  <path class="line" d="M345 207H470"/><path class="line" d="M685 207H810"/>

  <rect class="lane" x="45" y="305" width="1360" height="250" rx="16"/>
  <text class="label" x="72" y="337">Choose a disposition</text>
  <rect class="box" x="115" y="385" width="210" height="110" rx="11" fill="#fff8e8" stroke="#9e751d"/>
  <use href="#ico-x-circle" x="211" y="397" width="18" height="18"/>
  <text class="head" x="220" y="431">Close with a reason</text><text class="body" x="220" y="453">mitigated, false positive,</text><text class="body" x="220" y="474">out of scope, or duplicate</text>
  <rect class="box" x="430" y="385" width="210" height="110" rx="11" fill="#fff8e8" stroke="#9e751d"/>
  <use href="#ico-archive" x="526" y="397" width="18" height="18"/>
  <text class="head" x="535" y="431">Inactive finding</text><text class="body" x="535" y="453">historical review decision</text>
  <rect class="box" x="745" y="385" width="210" height="110" rx="11" fill="#f4efff" stroke="#7d69aa"/>
  <use href="#ico-shield" x="841" y="397" width="18" height="18"/>
  <text class="head" x="850" y="431">Risk acceptance</text><text class="body" x="850" y="453">justification and optional</text><text class="body" x="850" y="474">expiration decision</text>
  <rect class="box" x="1060" y="385" width="210" height="110" rx="11" fill="#eaf8f1" stroke="#4d9874"/>
  <use href="#ico-clock" x="1156" y="397" width="18" height="18"/>
  <text class="head" x="1165" y="431">Active or inactive</text><text class="body" x="1165" y="453">revoke or expiry determines</text><text class="body" x="1165" y="474">the next visible state</text>
  <path class="decision" d="M237 255V265L280 278V370H220V385"/><path class="line" d="M325 440H430"/><path class="decision" d="M237 255V265L280 278V370H850V385"/><path class="line" d="M955 440H1060"/>

  <rect class="lane" x="45" y="585" width="1360" height="55" rx="16"/>
  <text class="label" x="72" y="619">Bulk review</text><text x="255" y="619" font-family="Arial" font-size="14" fill="#52616b">Selected findings are locked while AIST applies a close, reopen, or risk-accept action; an overlapping action returns a conflict.</text>
</svg>
