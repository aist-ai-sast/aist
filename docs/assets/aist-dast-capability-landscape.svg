<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="960" viewBox="0 0 1100 960" role="img" aria-labelledby="title desc">
 <title id="title">AIST and DAST product responsibilities, architecture, integrations, and deployment</title>
 <desc id="desc">AIST aggregates and manages imported security findings using an application built on DefectDojo and a shared pipeline execution package loaded by its workers. DAST independently tests deployed systems and owns its evidence and reports. The products have separate deployments and integrations.</desc>
