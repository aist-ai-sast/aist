 <rect width="1100" height="960" fill="#fbfcfd"/>
 <text x="40" y="45" class="h">Two isolated products with complementary responsibilities</text>
 <text x="40" y="72" class="sub">AIST manages imported findings. DAST performs evidence-backed testing of deployed systems.</text>

 <rect x="30" y="100" width="510" height="800" class="zone" fill="#f4f8ff" stroke="#5c83b6"/>
 <circle cx="72" cy="143" r="24" fill="#dceaff"/><g color="#315f9c"><use href="#shield" x="60" y="131" width="24" height="24"/></g>
 <text x="108" y="139" class="ph">AIST</text><text x="108" y="162" class="s">Aggregate · triage · remediate</text>
 <rect x="55" y="190" width="460" height="62" class="box" fill="#edf5ff"/>
 <g color="#315f9c"><use href="#screen" x="72" y="207" width="24" height="24"/></g><text x="108" y="216" class="t">AIST application and control plane</text><text x="108" y="238" class="s">React UI · Django API · access · pipelines · integrations</text>
 <rect x="55" y="270" width="220" height="82" class="box" fill="#eaf8f1"/>
 <g color="#287955"><use href="#layers" x="72" y="287" width="24" height="24"/></g><text x="108" y="299" class="t">DefectDojo foundation</text><text x="72" y="327" class="s">Findings · tests · parsers</text><text x="72" y="346" class="xs">Embedded, not a remote service</text>
 <rect x="295" y="270" width="220" height="82" class="box" fill="#fff8e8"/>
 <g color="#9e751d"><use href="#container" x="312" y="287" width="24" height="24"/></g><text x="348" y="299" class="t">Execution package</text><text x="312" y="327" class="s">SAST + standalone containers</text><text x="312" y="346" class="xs">Loaded by Celery workers</text>
 <text x="55" y="388" class="sh">Product flow</text>
 <rect x="55" y="405" width="92" height="58" class="box" fill="#fff"/><text x="76" y="430" class="t">Onboard</text><text x="71" y="451" class="xs">source</text>
 <rect x="169" y="405" width="92" height="58" class="box" fill="#fff"/><text x="190" y="430" class="t">Execute</text><text x="184" y="451" class="xs">runtimes</text>
 <rect x="283" y="405" width="92" height="58" class="box" fill="#fff"/><text x="302" y="430" class="t">Prepare</text><text x="296" y="451" class="xs">findings</text>
 <rect x="397" y="405" width="118" height="58" class="box" fill="#fff"/><text x="421" y="430" class="t">Review</text><text x="410" y="451" class="xs">and remediate</text>
 <path d="M147 434h22M261 434h22M375 434h22" class="line"/>
 <text x="55" y="500" class="sh">Integrations</text>
 <rect x="55" y="518" width="220" height="75" class="box" fill="#fff"/>
 <use href="#github" x="72" y="535" width="22" height="22"/><use href="#gitlab" x="102" y="535" width="22" height="22"/>
 <text x="136" y="551" class="t">Source control</text><text x="72" y="578" class="xs">GitHub · GitLab · Gerrit · Gitea</text>
 <rect x="295" y="518" width="220" height="75" class="box" fill="#fff"/>
 <use href="#jira" x="312" y="535" width="22" height="22"/><g color="#9e751d"><use href="#ticket" x="342" y="535" width="22" height="22"/></g>
 <text x="376" y="551" class="t">Work items</text><text x="312" y="578" class="xs">3 synced · 3 link-only providers</text>
 <rect x="55" y="610" width="220" height="75" class="box" fill="#fff"/>
 <g color="#6b54a3"><use href="#agents" x="72" y="627" width="22" height="22"/></g><text x="106" y="643" class="t">AI execution</text><text x="72" y="670" class="xs">n8n webhook · local Claude CLI</text>
 <rect x="295" y="610" width="220" height="75" class="box" fill="#fff"/>
 <g color="#287955"><use href="#shield" x="312" y="627" width="22" height="22"/></g><text x="346" y="643" class="t">Operations</text><text x="312" y="670" class="xs">Org VPN · Slack · email · logs</text>
 <rect x="55" y="715" width="460" height="68" class="box" fill="#edf5ff"/>
 <g color="#315f9c"><use href="#server" x="72" y="735" width="24" height="24"/></g><text x="108" y="744" class="t">Docker Compose deployment</text><text x="108" y="767" class="s">Nginx · Django/React · PostgreSQL · Valkey · Celery</text>
 <rect x="55" y="805" width="460" height="68" rx="14" fill="#dfeeff" stroke="#5c83b6"/>
 <g color="#315f9c"><use href="#report" x="72" y="825" width="24" height="24"/></g><text x="108" y="835" class="t">Owns imported finding lifecycle</text><text x="108" y="858" class="s">Consolidated review, decisions, work items, and audit trail</text>

 <rect x="560" y="100" width="510" height="800" class="zone" fill="#fff8f3" stroke="#bd7a4d"/>
 <circle cx="602" cy="143" r="24" fill="#ffe8d7"/><g color="#a65324"><use href="#radar" x="590" y="131" width="24" height="24"/></g>
 <text x="638" y="139" class="ph">DAST</text><text x="638" y="162" class="s">Test deployed systems · retain evidence</text>
 <rect x="585" y="190" width="460" height="62" class="box" fill="#fff0f0"/>
 <g color="#a84949"><use href="#gateway" x="602" y="207" width="24" height="24"/></g><text x="638" y="216" class="t">Integration gateway</text><text x="638" y="238" class="s">Authenticates integrators and starts policy-approved runs</text>
 <rect x="585" y="270" width="220" height="82" class="box" fill="#f4efff"/>
 <g color="#6b54a3"><use href="#agents" x="602" y="287" width="24" height="24"/></g><text x="638" y="299" class="t">Testing runtime</text><text x="602" y="327" class="s">Supervisor · focused agents</text><text x="602" y="346" class="xs">Python engine · Claude Code</text>
 <rect x="825" y="270" width="220" height="82" class="box" fill="#eaf8f1"/>
 <g color="#287955"><use href="#report" x="842" y="287" width="24" height="24"/></g><text x="878" y="299" class="t">Evidence and reports</text><text x="842" y="327" class="s">Files are authoritative</text><text x="842" y="346" class="xs">SQLite index · optional triage UI</text>
 <text x="585" y="388" class="sh">Testing scope</text>
 <rect x="585" y="405" width="136" height="58" class="box" fill="#fff"/><text x="602" y="430" class="t">Source-driven</text><text x="602" y="451" class="xs">source + live target</text>
 <rect x="739" y="405" width="136" height="58" class="box" fill="#fff"/><text x="761" y="430" class="t">Black-box</text><text x="756" y="451" class="xs">deployed target</text>
 <rect x="893" y="405" width="152" height="58" class="box" fill="#fff"/><text x="927" y="430" class="t">Perimeter</text><text x="910" y="451" class="xs">fresh asset discovery</text>
 <rect x="585" y="478" width="460" height="44" rx="13" fill="#f4efff" stroke="#b9a7db"/>
 <text x="602" y="505" class="t">Launch mode: operator-guided or autonomous</text>
 <text x="585" y="558" class="sh">Context, research, and improvement</text>
 <rect x="585" y="576" width="220" height="92" class="box" fill="#fff"/>
 <g color="#e99022"><use href="#cloud" x="602" y="593" width="24" height="24"/></g><use href="#jira" x="635" y="593" width="22" height="22"/>
 <text x="670" y="609" class="t">AWS and Jira</text><text x="602" y="638" class="xs">Security Hub · Inspector</text><text x="602" y="657" class="xs">Prior issues · regression context</text>
 <rect x="825" y="576" width="220" height="92" class="box" fill="#fff"/>
 <g color="#a65324"><use href="#search" x="842" y="593" width="24" height="24"/></g><text x="878" y="609" class="t">Discovery every run</text><text x="842" y="638" class="xs">NVD · GHSA · ExploitDB</text><text x="842" y="657" class="xs">HackTricks · vendor advisories</text>
 <rect x="585" y="686" width="460" height="68" class="box" fill="#eaf8f1"/>
 <g color="#287955"><use href="#audit" x="602" y="706" width="24" height="24"/></g><text x="638" y="715" class="t">Self-audit and skill evolution</text><text x="638" y="738" class="s">Evidence gates every run · periodic agent and skill audit</text>
 <rect x="585" y="773" width="460" height="68" class="box" fill="#fff8e8"/>
 <g color="#9e751d"><use href="#server" x="602" y="793" width="24" height="24"/></g><text x="638" y="802" class="t">Separate host or VM</text><text x="638" y="825" class="s">Gateway · engine · evidence files · SQLite · reports</text>
 <rect x="585" y="855" width="460" height="28" rx="14" fill="#ffe8d7" stroke="#bd7a4d"/>
 <text x="602" y="875" class="s">Owns DAST execution, raw evidence, reports, and DAST-side triage</text>

 <rect x="190" y="914" width="720" height="30" rx="15" fill="#edf1f4"/>
 <text x="259" y="935" class="s">No shared database, user session, credential store, or runtime between the products</text>
</svg>
