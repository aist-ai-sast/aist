  <symbol id="ico-clock" viewBox="0 0 24 24"><path fill="none" stroke="#7d69aa" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20zM12 6.5v6l4 2"/></symbol>
 </defs>
 <rect width="1160" height="660" fill="#fbfcfd"/>
 <text x="50" y="44" class="h">One VPN integration, two independent sidecar lifecycles</text>
 <text x="50" y="68" class="s">The consumer of the request decides which lifecycle runs; the two pools never share a sidecar.</text>

 <rect x="430" y="92" width="300" height="52" class="b" fill="#edf5ff"/><text x="454" y="124" class="t">Organization VPN integration</text>
 <circle cx="702" cy="118" r="13" class="chip"/><use href="#ico-openvpn" x="693" y="109" width="18" height="18" aria-hidden="true"/>
 <path d="M530 144L310 224" class="l"/><path d="M630 144L855 224" class="l"/>

 <rect x="50" y="172" width="520" height="368" class="lane"/><text x="78" y="204" class="h">Execution sidecar</text>
 <rect x="80" y="224" width="460" height="56" class="b" fill="#edf5ff"/><text x="104" y="248" class="t">Worker starts execution</text><text x="104" y="270" class="s">SCM, validation, work items, pipeline, builder</text>
 <circle cx="509" cy="242" r="13" class="chip"/><use href="#ico-play" x="500" y="233" width="18" height="18" aria-hidden="true"/>
 <path d="M310 280L310 306" class="l"/>
 <rect x="80" y="306" width="460" height="56" class="b" fill="#fff8e8" stroke="#9e751d"/><text x="104" y="330" class="t">Sidecar created</text><text x="104" y="352" class="s">proxy URL or shared container network</text>
 <circle cx="509" cy="324" r="13" class="chip"/><use href="#ico-docker" x="500" y="315" width="18" height="18" aria-hidden="true"/>
 <path d="M310 362L310 388" class="l"/>
 <rect x="80" y="388" width="460" height="56" class="b" fill="#f4efff" stroke="#7d69aa"/><text x="104" y="412" class="t">Operation runs, then exits</text><text x="104" y="434" class="s">including the exception path</text>
 <circle cx="509" cy="406" r="13" class="chip"/><use href="#ico-refresh" x="500" y="397" width="18" height="18" aria-hidden="true"/>
 <path d="M310 444L310 470" class="l"/>
 <rect x="80" y="470" width="460" height="50" class="b" fill="#eaf8f1" stroke="#4d9874"/><text x="104" y="494" class="t">Sidecar removed</text><text x="104" y="513" class="s">orphan cleanup task covers abrupt termination</text>
 <circle cx="509" cy="486" r="13" class="chip"/><use href="#ico-trash" x="500" y="477" width="18" height="18" aria-hidden="true"/>

 <rect x="600" y="172" width="510" height="368" class="lane"/><text x="628" y="204" class="h">Warm egress</text>
 <rect x="630" y="224" width="460" height="56" class="b" fill="#edf5ff"/><text x="654" y="248" class="t">File or snippet request</text><text x="654" y="270" class="s">interactive UI browsing, not a worker task</text>
 <circle cx="1059" cy="264" r="13" class="chip"/><use href="#ico-file" x="1050" y="255" width="18" height="18" aria-hidden="true"/>
 <path d="M855 280L855 306" class="l"/>
 <rect x="630" y="306" width="460" height="56" class="b" fill="#fff8e8" stroke="#9e751d"/><text x="654" y="330" class="t">Worker starts or reuses warm sidecar</text><text x="654" y="352" class="s">pooled, keyed by VPN integration</text>
 <circle cx="1059" cy="324" r="13" class="chip"/><use href="#ico-docker" x="1050" y="315" width="18" height="18" aria-hidden="true"/>
 <path d="M950 296C1010 280 1040 260 1040 244" class="d"/><text x="915" y="238" class="s">optional prewarm from UI</text>
 <path d="M855 362L740 388" class="l"/><path d="M855 362L980 388" class="l"/>
 <rect x="630" y="388" width="220" height="56" class="b" fill="#f4efff" stroke="#7d69aa"/><text x="654" y="412" class="t">Warm: fetch now</text><text x="654" y="434" class="s">no wait</text>
 <circle cx="829" cy="406" r="13" class="chip"/><use href="#ico-check-circle" x="820" y="397" width="18" height="18" aria-hidden="true"/>
 <rect x="870" y="388" width="220" height="56" class="b" fill="#f4efff" stroke="#7d69aa"/><text x="894" y="412" class="t">Cold: 202 + retry</text><text x="894" y="434" class="s">warm-up queued</text>
 <circle cx="1069" cy="406" r="13" class="chip"/><use href="#ico-clock" x="1060" y="397" width="18" height="18" aria-hidden="true"/>
 <path d="M740 444L855 470" class="l"/><path d="M980 444L855 470" class="l"/>
 <rect x="630" y="470" width="460" height="50" class="b" fill="#eaf8f1" stroke="#4d9874"/><text x="654" y="494" class="t">Idle reaper + LRU cap</text><text x="654" y="513" class="s">keeps the warm pool bounded</text>
 <circle cx="1059" cy="486" r="13" class="chip"/><use href="#ico-trash" x="1050" y="477" width="18" height="18" aria-hidden="true"/>

 <rect x="300" y="556" width="560" height="56" class="b" fill="#fff0f0" stroke="#b86161"/>
 <text x="324" y="580" class="t">Docker socket decrypts credentials for any sidecar</text>
 <text x="324" y="602" class="s">Tinyproxy allow-lists only configured AIST container IPs</text>
 <circle cx="837" cy="578" r="15" class="chip"/><use href="#ico-docker" x="826" y="567" width="22" height="22" aria-hidden="true"/>
 <circle cx="811" cy="578" r="15" class="chip"/><use href="#ico-openvpn" x="800" y="567" width="22" height="22" aria-hidden="true"/>
 <text x="300" y="638" class="s">Without an active VPN, both lifecycles continue directly — no sidecar is created.</text>
</svg>
