<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="560" viewBox="0 0 1160 560" role="img" aria-labelledby="title desc">
 <title id="title">AIST Compose runtime responsibilities</title><desc id="desc">Nginx fronts uWSGI. uWSGI and Celery workers use PostgreSQL and Valkey. Beat schedules workers. Workers share a Unix socket with the local AI bridge and create pipeline or VPN containers through the Docker socket.</desc>
