<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="650" viewBox="0 0 1160 650" role="img" aria-labelledby="title desc">
  <title id="title">AIST Docker Compose runtime deployment</title>
  <desc id="desc">Users enter through Nginx and Django. Django and workers use PostgreSQL and Valkey. Celery Beat publishes scheduled work. Workers use a Unix socket to reach the local AI bridge and the Docker socket to create per-operation pipeline, connector, and VPN containers. External providers remain outside the deployment.</desc>
  <defs>
    <style>text{font-family:Arial,sans-serif;fill:#17212b}.title{font-size:22px;font-weight:700}.group{font-size:17px;font-weight:700}.name{font-size:15px;font-weight:700}.detail{font-size:12.5px;fill:#52616b}.host{fill:#f7f9fb;stroke:#9aa8b5;stroke-width:1.6;rx:18}.box{stroke:#52616b;stroke-width:1.5;rx:11}.net{fill:none;stroke:#596a78;stroke-width:2;marker-end:url(#arrow)}.local{fill:none;stroke:#7d69aa;stroke-width:2;stroke-dasharray:7 5;marker-end:url(#arrow)}</style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#596a78"/></marker>
  </defs>
  <rect width="1160" height="650" fill="#fbfcfd"/>
  <text x="50" y="46" class="title">AIST runtime deployment</text>
  <text x="50" y="69" class="detail">Solid arrows carry application traffic or queued work. Dashed arrows use a host-local socket or container-runtime boundary.</text>

  <rect x="160" y="92" width="840" height="470" class="host"/>
  <text x="185" y="122" class="group">AIST Docker Compose deployment</text>

  <rect x="30" y="170" width="110" height="62" class="box" fill="#ffffff"/>
  <text x="55" y="196" class="name">Users</text><text x="55" y="216" class="detail">browser · API</text>
  <rect x="205" y="160" width="150" height="78" class="box" fill="#edf5ff"/>
  <text x="230" y="191" class="name">Nginx</text><text x="230" y="214" class="detail">application ingress</text>
  <rect x="430" y="160" width="205" height="78" class="box" fill="#edf5ff"/>
  <text x="455" y="191" class="name">uWSGI / Django</text><text x="455" y="214" class="detail">web, API, authorization</text>
  <path d="M140 201L205 201" class="net"/><path d="M355 199L430 199" class="net"/>

  <rect x="220" y="292" width="170" height="72" class="box" fill="#eaf8f1"/>
  <text x="245" y="322" class="name">PostgreSQL</text><text x="245" y="345" class="detail">durable state</text>
  <rect x="455" y="292" width="150" height="72" class="box" fill="#fff8e8"/>
  <text x="480" y="322" class="name">Valkey</text><text x="480" y="345" class="detail">Celery broker</text>
  <rect x="670" y="292" width="135" height="72" class="box" fill="#f4efff"/>
  <text x="695" y="322" class="name">Celery Beat</text><text x="695" y="345" class="detail">recurring work</text>
  <rect x="845" y="292" width="130" height="72" class="box" fill="#f4efff"/>
  <text x="867" y="322" class="name">Workers</text><text x="867" y="345" class="detail">operations</text>
  <path d="M500 238L340 292" class="net"/><text x="368" y="273" class="detail">SQL</text>
  <path d="M565 238L530 292" class="net"/><text x="560" y="270" class="detail">enqueue</text>
  <path d="M737 292L737 265L530 265L530 292" class="net"/>
  <path d="M530 364L530 390L910 390L910 364" class="net"/>
  <path d="M875 364L875 405L305 405L305 364" class="net"/>

  <rect x="430" y="430" width="190" height="72" class="box" fill="#fff0f0"/>
  <text x="455" y="455" class="name">Local AI bridge</text><text x="455" y="478" class="detail">worker access</text><text x="455" y="496" class="detail">through a Unix socket</text>
  <rect x="700" y="420" width="250" height="92" class="box" fill="#fff0f0"/>
  <text x="725" y="449" class="name">Per-operation containers</text>
  <text x="725" y="472" class="detail">created through the Docker socket</text>
  <text x="725" y="493" class="detail">SAST · connector · VPN</text>
  <path d="M875 364L875 415L620 455" class="local"/>
  <path d="M930 364L930 395L850 420" class="local"/>

  <rect x="1018" y="390" width="122" height="94" class="box" fill="#ffffff"/>
  <text x="1038" y="418" class="name">External</text><text x="1038" y="439" class="detail">SCM · tickets</text><text x="1038" y="458" class="detail">webhooks · DAST</text>
  <path d="M950 466L1018 443" class="net"/>
  <path d="M635 198L985 198L985 420L1018 420" class="net"/>

  <text x="185" y="542" class="detail">The web process handles requests. Workers alone cross the Docker boundary or invoke the local bridge.</text>
  <text x="50" y="608" class="detail">PostgreSQL remains authoritative when broker delivery, worker execution, or an external provider is retried.</text>
</svg>
