<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="430" viewBox="0 0 1160 430" role="img" aria-labelledby="title desc">
  <title id="title">Scheduled pipeline launch lifecycle</title>
  <desc id="desc">A due schedule tick creates a durable launch request. Admission revalidates authority and readiness and checks capacity. A busy request remains pending and retries. A ready request creates a pipeline and runs it. Equivalent pending requests are coalesced and retained as superseded history.</desc>
  <defs>
    <style>text{font-family:Arial,sans-serif;fill:#17212b}.title{font-size:22px;font-weight:700}.name{font-size:15px;font-weight:700}.detail{font-size:12.5px;fill:#52616b}.box{stroke:#52616b;stroke-width:1.5;rx:12}.flow{fill:none;stroke:#596a78;stroke-width:2;marker-end:url(#arrow)}.return{fill:none;stroke:#9e751d;stroke-width:1.8;stroke-dasharray:7 5;marker-end:url(#arrow)}</style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#596a78"/></marker>
  </defs>
  <rect width="1160" height="430" fill="#fbfcfd"/>
  <text x="40" y="46" class="title">One schedule tick becomes one durable request before a pipeline exists</text>

  <rect x="40" y="112" width="180" height="78" class="box" fill="#f4efff"/>
  <text x="65" y="143" class="name">Schedule tick</text><text x="65" y="166" class="detail">saved launch configuration</text>
  <rect x="285" y="112" width="200" height="78" class="box" fill="#edf5ff"/>
  <text x="310" y="143" class="name">Launch request</text><text x="310" y="166" class="detail">durable waiting state</text>
  <rect x="550" y="100" width="235" height="102" class="box" fill="#fff8e8"/>
  <text x="575" y="132" class="name">Admission</text><text x="575" y="155" class="detail">authority · readiness</text><text x="575" y="176" class="detail">priority · capacity</text>
  <rect x="860" y="112" width="130" height="78" class="box" fill="#eaf8f1"/>
  <text x="885" y="143" class="name">Pipeline</text><text x="885" y="166" class="detail">created once</text>
  <rect x="1040" y="112" width="90" height="78" class="box" fill="#eaf8f1"/>
  <text x="1063" y="143" class="name">Run</text><text x="1057" y="166" class="detail">worker</text>
  <path d="M220 151L285 151" class="flow"/><path d="M485 151L550 151" class="flow"/><path d="M785 151L860 151" class="flow"/><path d="M990 151L1040 151" class="flow"/>

  <rect x="560" y="270" width="215" height="72" class="box" fill="#fff8e8"/>
  <text x="585" y="299" class="name">Wait and retry</text><text x="585" y="322" class="detail">pending until capacity or expiry</text>
  <path d="M668 202L668 270" class="return"/>
  <path d="M560 306L385 306L385 190" class="return"/>

  <rect x="40" y="266" width="365" height="84" class="box" fill="#ffffff"/>
  <text x="65" y="296" class="name">Equivalent pending request</text>
  <text x="65" y="319" class="detail">one request remains pending; replaced requests</text>
  <text x="65" y="338" class="detail">remain visible as superseded history</text>
  <path d="M300 266L350 190" class="return"/>

  <text x="40" y="397" class="detail">Run once enters the same lifecycle without changing the schedule's cron expression or last processed tick.</text>
</svg>
