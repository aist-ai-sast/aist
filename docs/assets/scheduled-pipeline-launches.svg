<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260" role="img" aria-labelledby="title desc">
<title id="title">Scheduled launch queue and dispatcher</title><desc id="desc">A due cron schedule creates a durable queue item. The dispatcher takes items FIFO, checks capacity, and either starts a run or leaves the item queued, preventing duplicate in-flight work for the same source version.</desc>
<defs>
 <symbol id="ico-clock" viewBox="0 0 24 24"><path fill="none" stroke="#7d69aa" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20zM12 6.5v6l4 2"/></symbol>
 <symbol id="ico-inbox" viewBox="0 0 24 24"><path fill="none" stroke="#52616b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M22 12h-6l-2 3h-4l-2-3H2M5 12 2 5a1 1 0 0 1 1-1h18a1 1 0 0 1 1 1l-3 7v6a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1z"/></symbol>
 <symbol id="ico-sliders" viewBox="0 0 24 24"><path fill="none" stroke="#9e751d" stroke-width="1.8" stroke-linecap="round" d="M2 6h22M2 12h22M2 18h22"/><circle cx="14" cy="6" r="2.2" fill="#9e751d"/><circle cx="8" cy="12" r="2.2" fill="#9e751d"/><circle cx="17" cy="18" r="2.2" fill="#9e751d"/></symbol>
 <symbol id="ico-check-circle" viewBox="0 0 24 24"><path fill="none" stroke="#9e751d" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20zM7.5 12l3 3 6-6.5"/></symbol>
 <symbol id="ico-play" viewBox="0 0 24 24"><path fill="none" stroke="#4d9874" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20z"/><path fill="#4d9874" stroke="none" d="M10 8l6 4-6 4z"/></symbol>
 <style>.chip{fill:#ffffff;fill-opacity:.9;stroke:#d4dce3;stroke-width:1}</style>
</defs>
<rect width="1000" height="260" fill="#fbfcfd"/><g font-family="Arial" fill="#17212b"><text x="40" y="42" font-size="20" font-weight="bold">Scheduled launch queue and dispatcher</text><g stroke="#52616b" stroke-width="2" fill="none"><path d="M190 135H250M430 135H490M670 135H730M890 135H920"/></g><g stroke="#52616b" stroke-width="2"><rect x="30" y="95" width="160" height="80" rx="12" fill="#f4efff"/><rect x="250" y="95" width="180" height="80" rx="12" fill="#edf5ff"/><rect x="490" y="95" width="180" height="80" rx="12" fill="#fff8e8"/><rect x="730" y="95" width="160" height="80" rx="12" fill="#fff8e8"/><rect x="920" y="95" width="60" height="80" rx="12" fill="#eaf8f1"/></g>
<circle cx="163" cy="113" r="13" class="chip"/><use href="#ico-clock" x="154" y="104" width="18" height="18"/>
<circle cx="403" cy="113" r="13" class="chip"/><use href="#ico-inbox" x="394" y="104" width="18" height="18"/>
<circle cx="643" cy="113" r="13" class="chip"/><use href="#ico-sliders" x="634" y="104" width="18" height="18"/>
<circle cx="863" cy="113" r="13" class="chip"/><use href="#ico-check-circle" x="854" y="104" width="18" height="18"/>
<circle cx="950" cy="113" r="11" class="chip"/><use href="#ico-play" x="943" y="106" width="14" height="14"/>
<g font-size="15"><text x="52" y="130">Cron schedule</text><text x="276" y="130">Queue item</text><text x="516" y="130">Dispatcher</text><text x="750" y="130">Capacity check</text><text x="930" y="153">Run</text></g><g font-size="13" fill="#52616b"><text x="52" y="153">due tick</text><text x="276" y="153">durable intent</text><text x="516" y="153">FIFO</text><text x="750" y="153">or stay queued</text><text x="40" y="225">The dispatcher also prevents duplicate in-flight work for the selected source version.</text></g></g></svg>
