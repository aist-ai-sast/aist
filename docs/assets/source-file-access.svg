 <circle cx="760" cy="361" r="11" class="chip"/><use href="#ico-git-branch" x="752" y="353" width="16" height="16" aria-hidden="true"/>
 <circle cx="1043" cy="364" r="11" class="chip"/><use href="#ico-github" x="1035" y="356" width="16" height="16" aria-hidden="true"/>
 <circle cx="1061" cy="364" r="11" class="chip"/><use href="#ico-gitlab" x="1053" y="356" width="16" height="16" aria-hidden="true"/>
