 <rect x="660" y="488" width="230" height="42" class="b" fill="#f4efff" stroke="#7d69aa"/><text x="696" y="514" class="t">Celery warm-egress worker</text><path d="M956 356C956 438 860 450 806 488" class="d"/>
 <circle cx="678" cy="509" r="11" class="chip"/><use href="#ico-refresh" x="670" y="501" width="16" height="16" aria-hidden="true"/>
 <text x="50" y="518" class="s">The response returns one file's bytes; it does not expose the pipeline workspace or a credential.</text>
