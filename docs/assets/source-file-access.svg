 <rect x="80" y="168" width="250" height="54" class="b" fill="#eef2f6" stroke="#667681"/><text x="102" y="191" class="t">Deduplication backfill</text><text x="102" y="210" class="s">operator maintenance command</text>
 <circle cx="315" cy="183" r="11" class="chip"/><g color="#667681"><use href="#ico-terminal" x="307" y="175" width="16" height="16" aria-hidden="true"/></g>
 <rect x="400" y="128" width="270" height="70" class="b" fill="#fdf0f0" stroke="#b86161"/><text x="424" y="158" class="t">Refuse unsafe path</text><text x="424" y="180" class="s">empty · absolute · .. · NUL</text>
