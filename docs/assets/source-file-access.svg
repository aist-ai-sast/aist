 <rect width="1160" height="560" fill="#fbfcfd"/><text x="50" y="54" class="h">File access selects a stored version before choosing its source path</text>
 <rect x="50" y="88" width="1060" height="90" class="lane"/><rect x="80" y="108" width="238" height="50" class="b" fill="#edf5ff"/><text x="104" y="139" class="t">Authorised project version</text><rect x="400" y="108" width="252" height="50" class="b" fill="#f4efff"/><text x="428" y="139" class="t">File endpoint selects type</text><path d="M318 133L400 133" class="l"/>
 <circle cx="303" cy="123" r="11" class="chip"/><use href="#ico-check-circle" x="295" y="115" width="16" height="16" aria-hidden="true"/>
 <circle cx="637" cy="123" r="11" class="chip"/><use href="#ico-sliders" x="629" y="115" width="16" height="16" aria-hidden="true"/>
 <rect x="50" y="218" width="508" height="234" class="lane"/><text x="78" y="252" class="h">Uploaded archive</text><rect x="78" y="286" width="180" height="70" class="b" fill="#fff8e8" stroke="#9e751d"/><text x="105" y="318" class="t">Ensure extracted</text><text x="105" y="340" class="s">archive root</text><rect x="338" y="286" width="188" height="70" class="b" fill="#eaf8f1" stroke="#4d9874"/><text x="366" y="318" class="t">Resolve relative file</text><text x="366" y="340" class="s">inside root</text><path d="M258 321L338 321" class="l"/><text x="78" y="414" class="s">No archive or no file: not found</text>
