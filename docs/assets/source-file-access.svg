<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="680" viewBox="0 0 1160 680" role="img" aria-labelledby="title desc">
 <title id="title">Source file access</title><desc id="desc">The file endpoint, for an authorised project version, and the deduplication backfill maintenance command use one source reader. The reader refuses an empty, absolute, parent-directory or NUL path before reading, then follows either the uploaded-archive path, which reads only inside the extraction, or the Git path, which fetches through the repository binding or the public raw-file location laid out for the stored SCM type; Gerrit has no public fallback. The Git path can use a warm VPN egress proxy; a cold proxy makes the endpoint queue a worker warm-up and return a retry response, while the backfill skips the file.</desc>
 <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#52616b"/></marker><style>text{font-family:Arial,sans-serif;fill:#17212b}.h{font-size:20px;font-weight:700}.t{font-size:15px}.s{font-size:13px;fill:#52616b}.b{stroke:#52616b;stroke-width:1.5;rx:12}.l{stroke:#52616b;stroke-width:2;fill:none;marker-end:url(#a)}.d{stroke:#8b98a4;stroke-width:1.5;stroke-dasharray:6 5;fill:none;marker-end:url(#a)}.lane{fill:#f7f9fb;stroke:#d4dce3;stroke-width:1.5;rx:16}.chip{fill:#ffffff;fill-opacity:.9;stroke:#d4dce3;stroke-width:1}</style>
