 <circle cx="1061" cy="382" r="11" class="chip"/><use href="#ico-gitea" x="1053" y="374" width="16" height="16" aria-hidden="true"/><path d="M776 381L834 381" class="l"/>
 <text x="630" y="446" class="s">Raw-file location follows the stored SCM type and host</text>
 <circle cx="641" cy="470" r="11" class="chip"/><use href="#ico-gerrit" x="633" y="462" width="16" height="16" aria-hidden="true"/><text x="660" y="475" class="s">Gerrit: through its binding only, no public fallback</text>
 <circle cx="641" cy="500" r="11" class="chip"/><use href="#ico-openvpn" x="633" y="492" width="16" height="16" aria-hidden="true"/><text x="660" y="497" class="s">Active VPN: fetch through the warm proxy; cold proxy:</text><text x="660" y="514" class="s">endpoint queues warm-up and asks for a retry; backfill skips</text>
 <path d="M910 198L910 330L168 330L168 346" class="l"/><path d="M910 198L910 330L703 330L703 346" class="l"/>
 <rect x="830" y="560" width="250" height="42" class="b" fill="#f4efff" stroke="#7d69aa"/><text x="872" y="586" class="t">Celery warm-egress worker</text><path d="M1095 416V581H1080" class="d"/>
 <circle cx="850" cy="581" r="11" class="chip"/><use href="#ico-refresh" x="842" y="573" width="16" height="16" aria-hidden="true"/>
 <text x="50" y="648" class="s">The reader returns one file's bytes; it does not expose the pipeline workspace or a credential.</text>
</svg>
