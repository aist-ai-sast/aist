 <rect x="602" y="218" width="508" height="234" class="lane"/><text x="630" y="252" class="h">Git version</text><rect x="630" y="286" width="146" height="70" class="b" fill="#fff8e8" stroke="#9e751d"/><text x="656" y="318" class="t">Resolve ref</text><text x="654" y="340" class="s">commit or branch</text><rect x="834" y="286" width="270" height="70" class="b" fill="#eaf8f1" stroke="#4d9874"/><text x="858" y="318" class="t">Fetch through binding</text><text x="858" y="340" class="s">or public raw URL</text>
