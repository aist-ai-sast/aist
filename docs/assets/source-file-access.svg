 <circle cx="1061" cy="304" r="11" class="chip"/><use href="#ico-gitlab" x="1053" y="296" width="16" height="16" aria-hidden="true"/>
 <circle cx="1043" cy="322" r="11" class="chip"/><use href="#ico-gerrit" x="1035" y="314" width="16" height="16" aria-hidden="true"/>
 <circle cx="1061" cy="322" r="11" class="chip"/><use href="#ico-gitea" x="1053" y="314" width="16" height="16" aria-hidden="true"/><path d="M776 321L834 321" class="l"/><text x="630" y="414" class="s">Active VPN: warm proxy; cold proxy: queue warm-up and return retry response</text>
