<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="1060" viewBox="0 0 1480 1060" role="img" aria-labelledby="title desc">
  <title id="title">AIST/DAST service boundary</title>
  <desc id="desc">AIST admits a DAST run, keeps durable pipeline control, and starts a connector in a worker container. The connector calls the separately deployed DAST gateway over HTTPS with a bearer token loaded from the organization's DAST integration; the gateway authenticates the run and returns a terminal result that AIST validates and imports. A result produced outside AIST can also be uploaded directly, skipping the connector and gateway. AIST retains its own integration configuration, pipeline control state, and imported findings; DAST retains target policy, provider-side execution, and raw evidence until the terminal result is imported.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><path d="M0 0L10 3.5 0 7z" fill="#52616b"/></marker>
    <marker id="arrow-return" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><path d="M0 0L10 3.5 0 7z" fill="#4d9874"/></marker>
    <marker id="arrow-purple" markerWidth="9" markerHeight="6.5" refX="8" refY="3.25" orient="auto"><path d="M0 0L9 3.25 0 6.5z" fill="#7d69aa"/></marker>
    <marker id="arrow-blue" markerWidth="9" markerHeight="6.5" refX="8" refY="3.25" orient="auto"><path d="M0 0L9 3.25 0 6.5z" fill="#315f9c"/></marker>
    <style>
      .zone{fill:#f7f9fb;stroke:#d4dce3;stroke-width:1.5}
      .box{stroke-width:2}
      .head{font:700 17px Arial;fill:#17212b;text-anchor:middle}
      .body{font:13.5px Arial;fill:#52616b;text-anchor:middle}
      .label{font:700 14px Arial;fill:#52616b}
      .line{stroke:#52616b;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
      .dline{stroke:#8b98a4;stroke-width:1.5;stroke-dasharray:6 5;fill:none}
      .cfgline{stroke:#7d69aa;stroke-width:1.6;stroke-dasharray:5 4;fill:none;marker-end:url(#arrow-purple)}
      .manualline{stroke:#315f9c;stroke-width:1.6;stroke-dasharray:5 4;fill:none;marker-end:url(#arrow-blue)}
      .rline{stroke:#4d9874;stroke-width:2.5;stroke-dasharray:2 5;fill:none;marker-end:url(#arrow-return)}
      .edge{font:12.5px Arial;fill:#52616b}
      .chip{fill:#ffffff;fill-opacity:.9;stroke:#d4dce3;stroke-width:1}
      .boundary{font:700 13px Arial;fill:#52616b;text-anchor:middle}
      .boundary-label{font:700 11px Arial;fill:#6b7883;letter-spacing:1px;text-anchor:middle}
      .foot{font:13px Arial;fill:#52616b}
      .badge{font:700 12px Arial;fill:#fff;text-anchor:middle}
      .sub{font:700 14px Arial;fill:#17212b}
      .small{font:12.5px Arial;fill:#52616b}
    </style>
    <symbol id="ico-postgresql" viewBox="0 0 24 24"><path fill="#4169E1" d="M23.5594 14.7228a.5269.5269 0 0 0-.0563-.1191c-.139-.2632-.4768-.3418-1.0074-.2321-1.6533.3411-2.2935.1312-2.5256-.0191 1.342-2.0482 2.445-4.522 3.0411-6.8297.2714-1.0507.7982-3.5237.1222-4.7316a1.5641 1.5641 0 0 0-.1509-.235C21.6931.9086 19.8007.0248 17.5099.0005c-1.4947-.0158-2.7705.3461-3.1161.4794a9.449 9.449 0 0 0-.5159-.0816 8.044 8.044 0 0 0-1.3114-.1278c-1.1822-.0184-2.2038.2642-3.0498.8406-.8573-.3211-4.7888-1.645-7.2219.0788C.9359 2.1526.3086 3.8733.4302 6.3043c.0409.818.5069 3.334 1.2423 5.7436.4598 1.5065.9387 2.7019 1.4334 3.582.553.9942 1.1259 1.5933 1.7143 1.7895.4474.1491 1.1327.1441 1.8581-.7279.8012-.9635 1.5903-1.8258 1.9446-2.2069.4351.2355.9064.3625 1.39.3772a.0569.0569 0 0 0 .0004.0041 11.0312 11.0312 0 0 0-.2472.3054c-.3389.4302-.4094.5197-1.5002.7443-.3102.064-1.1344.2339-1.1464.8115-.0025.1224.0329.2309.0919.3268.2269.4231.9216.6097 1.015.6331 1.3345.3335 2.5044.092 3.3714-.6787-.017 2.231.0775 4.4174.3454 5.0874.2212.5529.7618 1.9045 2.4692 1.9043.2505 0 .5263-.0291.8296-.0941 1.7819-.3821 2.5557-1.1696 2.855-2.9059.1503-.8707.4016-2.8753.5388-4.1012.0169-.0703.0357-.1207.057-.1362.0007-.0005.0697-.0471.4272.0307a.3673.3673 0 0 0 .0443.0068l.2539.0223.0149.001c.8468.0384 1.9114-.1426 2.5312-.4308.6438-.2988 1.8057-1.0323 1.5951-1.6698zM2.371 11.8765c-.7435-2.4358-1.1779-4.8851-1.2123-5.5719-.1086-2.1714.4171-3.6829 1.5623-4.4927 1.8367-1.2986 4.8398-.5408 6.108-.13-.0032.0032-.0066.0061-.0098.0094-2.0238 2.044-1.9758 5.536-1.9708 5.7495-.0002.0823.0066.1989.0162.3593.0348.5873.0996 1.6804-.0735 2.9184-.1609 1.1504.1937 2.2764.9728 3.0892.0806.0841.1648.1631.2518.2374-.3468.3714-1.1004 1.1926-1.9025 2.1576-.5677.6825-.9597.5517-1.0886.5087-.3919-.1307-.813-.5871-1.2381-1.3223-.4796-.839-.9635-2.0317-1.4155-3.5126zm6.0072 5.0871c-.1711-.0428-.3271-.1132-.4322-.1772.0889-.0394.2374-.0902.4833-.1409 1.2833-.2641 1.4815-.4506 1.9143-1.0002.0992-.126.2116-.2687.3673-.4426a.3549.3549 0 0 0 .0737-.1298c.1708-.1513.2724-.1099.4369-.0417.156.0646.3078.26.3695.4752.0291.1016.0619.2945-.0452.4444-.9043 1.2658-2.2216 1.2494-3.1676 1.0128zm2.094-3.988-.0525.141c-.133.3566-.2567.6881-.3334 1.003-.6674-.0021-1.3168-.2872-1.8105-.8024-.6279-.6551-.9131-1.5664-.7825-2.5004.1828-1.3079.1153-2.4468.079-3.0586-.005-.0857-.0095-.1607-.0122-.2199.2957-.2621 1.6659-.9962 2.6429-.7724.4459.1022.7176.4057.8305.928.5846 2.7038.0774 3.8307-.3302 4.7363-.084.1866-.1633.3629-.2311.5454zm7.3637 4.5725c-.0169.1768-.0358.376-.0618.5959l-.146.4383a.3547.3547 0 0 0-.0182.1077c-.0059.4747-.054.6489-.115.8693-.0634.2292-.1353.4891-.1794 1.0575-.11 1.4143-.8782 2.2267-2.4172 2.5565-1.5155.3251-1.7843-.4968-2.0212-1.2217a6.5824 6.5824 0 0 0-.0769-.2266c-.2154-.5858-.1911-1.4119-.1574-2.5551.0165-.5612-.0249-1.9013-.3302-2.6462.0044-.2932.0106-.5909.019-.8918a.3529.3529 0 0 0-.0153-.1126 1.4927 1.4927 0 0 0-.0439-.208c-.1226-.4283-.4213-.7866-.7797-.9351-.1424-.059-.4038-.1672-.7178-.0869.067-.276.1831-.5875.309-.9249l.0529-.142c.0595-.16.134-.3257.213-.5012.4265-.9476 1.0106-2.2453.3766-5.1772-.2374-1.0981-1.0304-1.6343-2.2324-1.5098-.7207.0746-1.3799.3654-1.7088.5321a5.6716 5.6716 0 0 0-.1958.1041c.0918-1.1064.4386-3.1741 1.7357-4.4823a4.0306 4.0306 0 0 1 .3033-.276.3532.3532 0 0 0 .1447-.0644c.7524-.5706 1.6945-.8506 2.802-.8325.4091.0067.8017.0339 1.1742.081 1.939.3544 3.2439 1.4468 4.0359 2.3827.8143.9623 1.2552 1.9315 1.4312 2.4543-1.3232-.1346-2.2234.1268-2.6797.779-.9926 1.4189.543 4.1729 1.2811 5.4964.1353.2426.2522.4522.2889.5413.2403.5825.5515.9713.7787 1.2552.0696.087.1372.1714.1885.245-.4008.1155-1.1208.3825-1.0552 1.717-.0123.1563-.0423.4469-.0834.8148-.0461.2077-.0702.4603-.0994.7662zm.8905-1.6211c-.0405-.8316.2691-.9185.5967-1.0105a2.8566 2.8566 0 0 0 .135-.0406 1.202 1.202 0 0 0 .1342.103c.5703.3765 1.5823.4213 3.0068.1344-.2016.1769-.5189.3994-.9533.6011-.4098.1903-1.0957.333-1.7473.3636-.7197.0336-1.0859-.0807-1.1721-.151zm.5695-9.2712c-.0059.3508-.0542.6692-.1054 1.0017-.055.3576-.112.7274-.1264 1.1762-.0142.4368.0404.8909.0932 1.3301.1066.887.216 1.8003-.2075 2.7014a3.5272 3.5272 0 0 1-.1876-.3856c-.0527-.1276-.1669-.3326-.3251-.6162-.6156-1.1041-2.0574-3.6896-1.3193-4.7446.3795-.5427 1.3408-.5661 2.1781-.463zm.2284 7.0137a12.3762 12.3762 0 0 0-.0853-.1074l-.0355-.0444c.7262-1.1995.5842-2.3862.4578-3.4385-.0519-.4318-.1009-.8396-.0885-1.2226.0129-.4061.0666-.7543.1185-1.0911.0639-.415.1288-.8443.1109-1.3505.0134-.0531.0188-.1158.0118-.1902-.0457-.4855-.5999-1.938-1.7294-3.253-.6076-.7073-1.4896-1.4972-2.6889-2.0395.5251-.1066 1.2328-.2035 2.0244-.1859 2.0515.0456 3.6746.8135 4.8242 2.2824a.908.908 0 0 1 .0667.1002c.7231 1.3556-.2762 6.2751-2.9867 10.5405zm-8.8166-6.1162c-.025.1794-.3089.4225-.6211.4225a.5821.5821 0 0 1-.0809-.0056c-.1873-.026-.3765-.144-.5059-.3156-.0458-.0605-.1203-.178-.1055-.2844.0055-.0401.0261-.0985.0925-.1488.1182-.0894.3518-.1226.6096-.0867.3163.0441.6426.1938.6113.4186zm7.9305-.4114c.0111.0792-.049.201-.1531.3102-.0683.0717-.212.1961-.4079.2232a.5456.5456 0 0 1-.075.0052c-.2935 0-.5414-.2344-.5607-.3717-.024-.1765.2641-.3106.5611-.352.297-.0414.6111.0088.6356.1851z"/></symbol>
    <symbol id="ico-lock" viewBox="0 0 24 24"><path fill="none" stroke="#3f7d92" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M6 11V7a6 6 0 0 1 12 0v4M5 11h14a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1v-9a1 1 0 0 1 1-1z"/></symbol>
    <symbol id="ico-server" viewBox="0 0 24 24"><path fill="none" stroke="#3f7d92" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M3 4h18a1 1 0 0 1 1 1v5a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1zm0 9h18a1 1 0 0 1 1 1v5a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1v-5a1 1 0 0 1 1-1z"/><circle cx="6" cy="8" r="1" fill="#3f7d92" stroke="none"/><circle cx="6" cy="17" r="1" fill="#3f7d92" stroke="none"/></symbol>
    <symbol id="ico-play" viewBox="0 0 24 24"><path fill="none" stroke="#9e751d" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20z"/><path fill="#9e751d" stroke="none" d="M10 8l6 4-6 4z"/></symbol>
    <symbol id="ico-check-circle" viewBox="0 0 24 24"><path fill="none" stroke="#4d9874" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20zM7.5 12l3 3 6-6.5"/></symbol>
    <symbol id="ico-key" viewBox="0 0 24 24"><circle cx="8" cy="12" r="5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M13 12h9M18 12v3M21 12v3" stroke="currentColor" stroke-width="2" fill="none"/></symbol>
    <symbol id="ico-database" viewBox="0 0 24 24"><ellipse cx="12" cy="5" rx="8" ry="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M4 5v7c0 1.7 3.6 3 8 3s8-1.3 8-3V5M4 12v7c0 1.7 3.6 3 8 3s8-1.3 8-3v-7" fill="none" stroke="currentColor" stroke-width="2"/></symbol>
    <symbol id="ico-upload" viewBox="0 0 24 24"><path d="M12 16V4M7 9l5-5 5 5M4 15v6h16v-6" fill="none" stroke="currentColor" stroke-width="2"/></symbol>
  </defs>
  <rect width="1480" height="1060" fill="#fff"/>
  <text x="48" y="44" font-family="Arial" font-size="26" font-weight="700" fill="#17212b">AIST/DAST service boundary</text>
  <text x="48" y="70" font-family="Arial" font-size="15" fill="#52616b">A DAST run crosses one HTTPS boundary from the AIST worker to the DAST integration gateway; a result produced outside AIST can also be imported directly.</text>
  <text class="boundary" x="830" y="96">AIST ↔ DAST (separate deployment)</text>

  <rect class="zone" x="40" y="108" width="760" height="780" rx="18"/>
  <text class="label" x="60" y="136">INSIDE AIST</text>
  <rect class="zone" x="860" y="108" width="580" height="780" rx="18"/>
  <text class="label" x="880" y="136">DAST INTEGRATION (SEPARATE HOST)</text>
  <path class="dline" d="M830 118V868"/>
  <text class="boundary-label" x="846" y="493" transform="rotate(-90 846 493)">SERVICE BOUNDARY</text>

  <!-- Left column: AIST launch/execution chain -->
  <rect class="box" x="100" y="168" width="640" height="78" rx="11" fill="#edf5ff" stroke="#52616b"/>
  <circle cx="122" cy="190" r="13" fill="#52616b"/><text class="badge" x="122" y="194">1</text>
  <text class="head" x="420" y="200">Admit the DAST run</text>
  <text class="body" x="420" y="224">authorize project · check readiness · wait for capacity</text>
  <circle cx="690" cy="190" r="13" class="chip"/><use href="#ico-postgresql" x="681" y="181" width="18" height="18"/>

  <path class="line" d="M420 246V276"/>

  <rect class="box" x="100" y="276" width="640" height="96" rx="11" fill="#f4efff" stroke="#7d69aa"/>
  <circle cx="122" cy="298" r="13" fill="#7d69aa"/><text class="badge" x="122" y="302">2</text>
  <text class="head" x="420" y="308">Prepare provider execution</text>
  <text class="body" x="420" y="331">resolve the project binding and provider capability</text>
  <text class="body" x="420" y="351">credentials are not part of this durable request</text>

  <path class="line" d="M420 372V402"/>

  <rect class="box" x="100" y="402" width="640" height="78" rx="11" fill="#edf5ff" stroke="#52616b"/>
  <circle cx="122" cy="424" r="13" fill="#52616b"/><text class="badge" x="122" y="428">3</text>
  <text class="head" x="420" y="434">Durable pipeline control</text>
  <text class="body" x="420" y="458">dispatch · cancellation intent · recovery state</text>
  <circle cx="690" cy="424" r="13" class="chip"/><use href="#ico-postgresql" x="681" y="415" width="18" height="18"/>

  <path class="line" d="M420 480V510"/>

  <rect class="box" x="100" y="510" width="640" height="98" rx="11" fill="#fff8e8" stroke="#9e751d"/>
  <circle cx="122" cy="532" r="13" fill="#9e751d"/><text class="badge" x="122" y="536">4</text>
  <text class="head" x="420" y="542">DAST connector (worker container)</text>
  <text class="body" x="420" y="565">uses the integration's HTTPS and optional VPN boundary</text>
  <text class="body" x="420" y="585">starts, observes, and cancels the provider run</text>
  <circle cx="690" cy="534" r="13" class="chip"/><use href="#ico-play" x="681" y="525" width="18" height="18"/>

  <!-- Credential source, branching into the connector at start -->
  <rect class="box" x="100" y="628" width="360" height="64" rx="11" fill="#f4efff" stroke="#7d69aa"/>
  <g color="#7d69aa"><use href="#ico-key" x="118" y="644" width="20" height="20"/></g>
  <text class="sub" x="280" y="654" text-anchor="middle">DAST integration</text>
  <text class="small" x="280" y="674" text-anchor="middle">gateway URL + service token, loaded at start</text>
  <path class="cfgline" d="M280 628L280 608"/>
  <text class="edge" x="300" y="617">supplies config</text>

  <path class="line" d="M650 608V712"/>

  <rect class="box" x="100" y="712" width="640" height="64" rx="11" fill="#eaf8f1" stroke="#4d9874"/>
  <circle cx="122" cy="734" r="13" fill="#4d9874"/><text class="badge" x="122" y="738">7</text>
  <text class="body" x="420" y="738" style="font:700 14px Arial;fill:#17212b">Validate identity and report</text>
  <text class="body" x="420" y="760">import tests and findings into the normal AIST lifecycle</text>
  <circle cx="690" cy="734" r="13" class="chip"/><use href="#ico-check-circle" x="681" y="725" width="18" height="18"/>

  <!-- Manual import, bypassing connector and gateway entirely -->
  <rect class="box" x="100" y="800" width="360" height="60" rx="11" fill="#edf5ff" stroke="#315f9c"/>
  <g color="#315f9c"><use href="#ico-upload" x="118" y="815" width="20" height="20"/></g>
  <text class="sub" x="280" y="825" text-anchor="middle">Manual report upload</text>
  <text class="small" x="280" y="845" text-anchor="middle">uploaded without contacting the gateway</text>
  <path class="manualline" d="M280 800L280 776"/>
  <text class="edge" x="300" y="791">skips the connector</text>

  <!-- Right column: DAST gateway + host-side runner -->
  <rect class="box" x="900" y="510" width="520" height="98" rx="11" fill="#eaf3f7" stroke="#3f7d92"/>
  <circle cx="922" cy="532" r="13" fill="#3f7d92"/><text class="badge" x="922" y="536">5</text>
  <text class="head" x="1160" y="542">DAST integration gateway</text>
  <text class="body" x="1160" y="565">authenticates the integration and manages provider runs</text>
  <text class="body" x="1160" y="585">returns progress and a typed terminal result</text>
  <circle cx="1390" cy="534" r="13" class="chip"/><use href="#ico-lock" x="1381" y="525" width="18" height="18"/>

  <path class="line" d="M1160 608V640"/>

  <rect class="box" x="900" y="640" width="520" height="64" rx="11" fill="#eaf3f7" stroke="#3f7d92"/>
  <circle cx="922" cy="662" r="13" fill="#3f7d92"/><text class="badge" x="922" y="666">6</text>
  <text class="body" x="1160" y="666" style="font:700 14px Arial;fill:#17212b">Host-side DAST runner</text>
  <text class="body" x="1160" y="688">performs target testing and produces the report</text>
  <circle cx="1390" cy="662" r="13" class="chip"/><use href="#ico-server" x="1381" y="653" width="18" height="18"/>

  <!-- Crossing arrows -->
  <path class="line" d="M740 559H900"/>
  <text class="edge" x="820" y="542" text-anchor="middle">poll status/logs</text>
  <circle cx="764" cy="580" r="10" class="chip"/><use href="#ico-lock" x="757" y="573" width="14" height="14"/>
  <text class="edge" x="778" y="584">HTTPS</text>
  <circle cx="826" cy="580" r="10" class="chip"/><g color="#52616b"><use href="#ico-key" x="819" y="573" width="14" height="14"/></g>
  <text class="edge" x="840" y="584">Bearer</text>

  <path class="rline" d="M900 605C850 645 800 690 740 728"/>
  <text class="edge" x="800" y="650" text-anchor="middle" fill="#4d9874">terminal result (validated)</text>

  <text class="foot" x="48" y="908">Cancellation and recovery follow the same connector → gateway boundary.</text>

  <!-- What stays where -->
  <rect x="40" y="928" width="760" height="92" rx="14" fill="#edf5ff" stroke="#5c83b6"/>
  <g color="#315f9c"><use href="#ico-database" x="60" y="946" width="26" height="26"/></g>
  <text class="sub" x="100" y="958">Remains in AIST</text>
  <text class="small" x="100" y="982">Integration config (URL, write-only token) · synchronized target</text>
  <text class="small" x="100" y="1002">capabilities · project↔target binding · pipeline control state · imported tests and findings</text>

  <rect x="860" y="928" width="580" height="92" rx="14" fill="#eaf3f7" stroke="#3f7d92"/>
  <g color="#3f7d92"><use href="#ico-database" x="880" y="946" width="26" height="26"/></g>
  <text class="sub" x="920" y="958">Remains in DAST</text>
  <text class="small" x="920" y="982">Target policy and provider-side execution and progress</text>
  <text class="small" x="920" y="1002">Raw evidence and the terminal result until AIST imports it</text>
</svg>
