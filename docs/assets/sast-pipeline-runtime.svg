 <rect x="336" y="180" width="202" height="90" class="b" fill="#f4efff" stroke="#7d69aa"/><text x="364" y="215" class="t">Run workspace</text><text x="364" y="239" class="s">one build path</text>
 <circle cx="518" cy="198" r="14" class="chip"/><use href="#ico-folder" x="509" y="189" width="18" height="18" aria-hidden="true"/>
 <rect x="586" y="156" width="204" height="70" class="b" fill="#fff8e8" stroke="#9e751d"/><text x="614" y="197" class="t">Builder container</text>
 <circle cx="767" cy="177" r="15" class="chip"/><use href="#ico-docker" x="756" y="166" width="22" height="22" aria-hidden="true"/>
 <rect x="586" y="248" width="204" height="70" class="b" fill="#fff8e8" stroke="#9e751d"/><text x="608" y="289" class="t">Analyzer containers</text>
 <circle cx="767" cy="269" r="15" class="chip"/><use href="#ico-docker" x="756" y="258" width="22" height="22" aria-hidden="true"/>
 <rect x="858" y="180" width="224" height="90" class="b" fill="#eaf8f1" stroke="#4d9874"/><text x="884" y="215" class="t">Run output directory</text><text x="884" y="239" class="s">reports partitioned by run</text>
 <circle cx="1057" cy="198" r="14" class="chip"/><use href="#ico-folder" x="1048" y="189" width="18" height="18" aria-hidden="true"/>
 <path d="M268 225L336 225M538 205L586 191M538 247L586 283M790 191L858 211M790 283L858 239" class="l"/>
 <rect x="858" y="325" width="224" height="40" class="b" fill="#edf5ff"/><text x="893" y="351" class="t">Platform importer</text><path d="M970 270L970 325" class="l"/>
 <circle cx="1057" cy="345" r="12" class="chip"/><use href="#ico-download" x="1049" y="337" width="16" height="16" aria-hidden="true"/>
 <path d="M690 156C690 118 780 118 780 156" class="d"/><text x="615" y="118" class="s">per-pipeline analyzer configuration</text>
 <text x="50" y="434" class="s">The runtime creates reports. Import, deduplication, enrichment, review, and AI verdicts are platform responsibilities.</text>
