<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="650" viewBox="0 0 1400 650" role="img" aria-labelledby="title desc">
  <title id="title">AIST control plane and pipeline execution runtime</title>
  <desc id="desc">AIST validates a durable launch request through its execution-driver registry, persists an admitted pipeline, capacity lease, and publish intent, then sends only the pipeline identity through the broker. A worker accepts one delivery, reloads durable state, and uses the shared pipeline execution package to select either SAST workspace and analyzers or a standalone DAST connector. Results and recovery checkpoints return to AIST.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0L9 4L0 8Z" fill="#596a78"/></marker>
    <style>text{font-family:Arial,sans-serif;fill:#17212b}.title{font-size:26px;font-weight:700}.zone-title{font-size:17px;font-weight:700}.head{font-size:16px;font-weight:700;text-anchor:middle}.body{font-size:13px;fill:#52616b;text-anchor:middle}.note{font-size:13px;fill:#52616b}.zone{fill:#f7f9fb;stroke:#d4dce3;stroke-width:1.5}.box{stroke:#52616b;stroke-width:1.6}.flow{fill:none;stroke:#596a78;stroke-width:2.1;marker-end:url(#arrow)}.return{fill:none;stroke:#4d9874;stroke-width:2;stroke-dasharray:7 5;marker-end:url(#arrow)}.boundary{fill:none;stroke:#8fa0b0;stroke-width:1.5;stroke-dasharray:8 6}</style>
  </defs>
  <rect width="1400" height="650" fill="#ffffff"/>
  <text x="45" y="45" class="title">Pipeline execution runtime</text>
  <text x="45" y="72" class="note">The execution package runs inside the worker; only its workload containers cross the container-runtime boundary.</text>

  <rect x="35" y="100" width="430" height="490" rx="16" class="zone"/>
  <text x="58" y="132" class="zone-title">AIST durable control plane</text>

  <rect x="80" y="165" width="340" height="74" rx="12" class="box" fill="#edf5ff"/>
  <text x="250" y="196" class="head">Launch request</text>
  <text x="250" y="221" class="body">authority · frozen parameters · target</text>

  <rect x="80" y="275" width="340" height="88" rx="12" class="box" fill="#fff8e8" stroke="#9e751d"/>
  <text x="250" y="306" class="head">Execution-driver registry</text>
  <text x="250" y="331" class="body">plan · initialize · cancel · recover</text>
  <text x="250" y="351" class="body">SAST and DAST share the lifecycle contract</text>

  <rect x="80" y="400" width="340" height="104" rx="12" class="box" fill="#eaf8f1" stroke="#4d9874"/>
  <text x="250" y="431" class="head">PostgreSQL transaction</text>
  <text x="250" y="456" class="body">Admitted pipeline · capacity lease</text>
  <text x="250" y="476" class="body">publish intent · provider checkpoint</text>
  <text x="250" y="496" class="body">durable source of truth</text>

  <path d="M250 239V275M250 363V400" class="flow"/>

  <rect x="510" y="100" width="850" height="490" rx="16" class="zone"/>
  <text x="533" y="132" class="zone-title">Celery worker and shared execution package</text>

  <rect x="535" y="165" width="210" height="88" rx="12" class="box" fill="#f4efff" stroke="#7d69aa"/>
  <text x="640" y="196" class="head">Generic broker task</text>
  <text x="640" y="221" class="body">pipeline identity only</text>
  <text x="640" y="241" class="body">matching delivery accepted once</text>

  <rect x="790" y="165" width="230" height="88" rx="12" class="box" fill="#f4efff" stroke="#7d69aa"/>
  <text x="905" y="196" class="head">Reload durable state</text>
  <text x="905" y="221" class="body">pipeline → Executing</text>
  <text x="905" y="241" class="body">resolve lifecycle driver</text>

  <rect x="1065" y="165" width="245" height="88" rx="12" class="box" fill="#fff8e8" stroke="#9e751d"/>
  <text x="1187" y="196" class="head">Runtime registry</text>
  <text x="1187" y="221" class="body">one library execution facade</text>
  <text x="1187" y="241" class="body">select SAST or standalone provider</text>

  <path d="M745 209H790M1020 209H1065" class="flow"/>

  <rect x="555" y="315" width="735" height="230" rx="14" class="boundary"/>
  <text x="578" y="345" class="zone-title" style="fill:#52616b">Per-operation container boundary</text>

  <rect x="590" y="385" width="235" height="105" rx="12" class="box" fill="#fff8e8" stroke="#9e751d"/>
  <text x="707" y="416" class="head">SAST runtime</text>
  <text x="707" y="441" class="body">isolated workspace · builder</text>
  <text x="707" y="461" class="body">selected analyzer containers</text>
  <text x="707" y="481" class="body">partitioned reports</text>

  <rect x="1000" y="385" width="255" height="105" rx="12" class="box" fill="#eaf3f7" stroke="#3f7d92"/>
  <text x="1127" y="416" class="head">DAST runtime</text>
  <text x="1127" y="441" class="body">connector container · optional VPN</text>
  <text x="1127" y="461" class="body">external gateway calls</text>
  <text x="1127" y="481" class="body">bounded outcome + checkpoint</text>

  <path d="M1187 253V290H707V385M1187 253V385" class="flow"/>

  <rect x="840" y="400" width="140" height="75" rx="11" class="box" fill="#eaf8f1" stroke="#4d9874"/>
  <text x="910" y="428" class="head" style="font-size:15px">Runtime outcome</text>
  <text x="910" y="450" class="body">report or terminal state</text>
  <text x="910" y="468" class="body">recovery checkpoint</text>
  <path d="M825 437H840M1000 437H980" class="return"/>

  <path d="M420 452H480V209H535" class="flow"/>
  <text x="476" y="188" class="note" style="text-anchor:end">publish</text>
  <path d="M910 475V525H480V520H420" class="return"/>
  <text x="490" y="542" class="note">validated result, terminal outcome, or recovery checkpoint</text>

  <text x="45" y="624" class="note">Reconciliation repairs stale claims, publish intents, and leases from durable state; it never requires provider-specific broker messages.</text>
</svg>
