<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="500" viewBox="0 0 1160 500" role="img" aria-labelledby="title desc">
 <title id="title">Responsibilities of the SAST pipeline runtime</title><desc id="desc">A pipeline worker supplies one source version to a run-specific workspace. The builder and analyzer containers write reports to a run-specific output directory, from which the platform importer reads them.</desc>
